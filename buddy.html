<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src {{csp}} data:; script-src 'nonce-{{nonce}}';">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  #stage {
    position: relative; width: 100%; height: 100%;
    font-family: -apple-system, "Segoe UI", sans-serif;
    user-select: none;
  }
  #floor {
    position: absolute; left: 0; right: 0; bottom: 10px; height: 1px;
    background: var(--vscode-editorWidget-border, rgba(128,128,128,.35));
  }
  #char {
    position: absolute; bottom: 11px; width: 78px; height: 78px;
    cursor: pointer; transform-origin: 50% 100%;
    transition: filter .2s;
  }
  #char:hover { filter: brightness(1.1); }
  #char svg {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%; display: block; overflow: visible;
  }
  #char.img svg { display: none; }
  /* One layer per moving part, each painted once and moved by the compositor.
     (Their drop shadow is the SVG filter #lift, painted with the layer: as a
     CSS filter the compositor redid it every frame, doubling the GPU time.) */
  #rig { position: absolute; inset: 0; }
  #rig svg { will-change: transform; }
  #charimg {
    display: none; width: 100%; height: 100%;
    object-fit: contain; object-position: bottom;
    image-rendering: auto; pointer-events: none;
  }
  #char .ln { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #char .es, #char .ex { display: none; }
  #rig svg.beacon { animation: beacon 2.4s ease-in-out infinite; }
  @keyframes beacon { 0%, 55%, 100% { opacity: 1; } 70%, 85% { opacity: .25; } }

  #bubble {
    position: absolute; max-width: 320px;
    background: var(--vscode-editorWidget-background, #252526);
    color: var(--vscode-editorWidget-foreground, #ccc);
    border: 1px solid var(--vscode-editorWidget-border, #454545);
    border-radius: 10px; padding: 9px 12px;
    font-size: 12.5px; line-height: 1.45;
    opacity: 0; transition: opacity .18s; pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: ""; position: absolute; bottom: -6px; left: 26px;
    width: 10px; height: 10px; transform: rotate(45deg);
    background: inherit;
    border-right: 1px solid var(--vscode-editorWidget-border, #454545);
    border-bottom: 1px solid var(--vscode-editorWidget-border, #454545);
  }
  #bubble b { color: var(--vscode-textLink-foreground, #4daafc); }
  #bubble .sub {
    display: block; margin-top: 4px;
    color: var(--vscode-descriptionForeground, #999); font-size: 11.5px;
  }

  .fx {
    position: absolute; font-size: 13px; pointer-events: none;
    animation: floatup 1.6s ease-out forwards;
  }
  @keyframes floatup {
    from { opacity: .95; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-34px); }
  }
  #hint {
    position: absolute; right: 10px; bottom: 16px;
    font-size: 11px; color: var(--vscode-descriptionForeground, #888);
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { .fx { animation-duration: .01s; } #rig svg.beacon { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="floor"></div>
  <div id="char" title="Click me, or drag me out of the way">
    <img id="charimg" alt="buddy">
    <!-- Every character is drawn in profile facing right (+x); dir=-1 mirrors.
         The ground is y=40, the bottom of the box. Inside a body:
           data-limb + data-p  a part the rig turns, and the point it turns about
           .eo / .es / .ex     the eyes open / shut / dazed
           data-states         drawn only in those moods: calm, waiting, done, error -->
    <svg id="charsvg" viewBox="-60 -80 120 120">
      <defs>
        <filter id="fur" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.3"/></filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4"/></filter>
        <!-- lifts the character off any wallpaper or editor theme -->
        <!-- (a fixed region: one sized from the part collapses on a straight line, and clips a glow) -->
        <filter id="lift" filterUnits="userSpaceOnUse" x="-75" y="-95" width="150" height="150"><feDropShadow dx="0" dy="1.5" stdDeviation="1.3" flood-color="#000" flood-opacity=".3"/></filter>
        <radialGradient id="shadowG"><stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
        <!-- red panda -->
        <radialGradient id="rpFur" cx=".45" cy=".25" r=".8"><stop offset="0" stop-color="#f0995a"/><stop offset=".55" stop-color="#cc5f2a"/><stop offset="1" stop-color="#8a3414"/></radialGradient>
        <radialGradient id="rpDark" cx=".45" cy=".3" r=".8"><stop offset="0" stop-color="#6a3c2a"/><stop offset="1" stop-color="#26130c"/></radialGradient>
        <radialGradient id="rpEye" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#6a3a22"/><stop offset="1" stop-color="#140a06"/></radialGradient>
        <!-- robot -->
        <linearGradient id="robBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f7"/><stop offset=".45" stop-color="#bcc6d3"/><stop offset="1" stop-color="#7f8a9b"/></linearGradient>
        <linearGradient id="robLimb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a8597"/><stop offset=".4" stop-color="#e2e8ef"/><stop offset=".7" stop-color="#a9b3c1"/><stop offset="1" stop-color="#6c7788"/></linearGradient>
        <linearGradient id="robFar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5d6676"/><stop offset=".45" stop-color="#9aa4b3"/><stop offset="1" stop-color="#505968"/></linearGradient>
        <linearGradient id="robVisor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26313f"/><stop offset="1" stop-color="#0a0e14"/></linearGradient>
        <radialGradient id="robJoint" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#5b6575"/><stop offset="1" stop-color="#232933"/></radialGradient>
        <!-- cat -->
        <radialGradient id="catFur" cx=".45" cy=".25" r=".8"><stop offset="0" stop-color="#c9cbcf"/><stop offset=".55" stop-color="#9b9ea4"/><stop offset="1" stop-color="#6a6e75"/></radialGradient>
        <linearGradient id="catFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f838a"/><stop offset="1" stop-color="#5e6168"/></linearGradient>
        <radialGradient id="catIris" cx=".45" cy=".45" r=".6"><stop offset="0" stop-color="#eef59a"/><stop offset=".55" stop-color="#b5cc3e"/><stop offset="1" stop-color="#5f7a1c"/></radialGradient>
        <linearGradient id="catEarIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98490"/><stop offset="1" stop-color="#f2bcc4"/></linearGradient>
        <!-- pup -->
        <radialGradient id="pupFur" cx=".45" cy=".25" r=".8"><stop offset="0" stop-color="#f4cd95"/><stop offset=".55" stop-color="#d89a58"/><stop offset="1" stop-color="#a0612a"/></radialGradient>
        <linearGradient id="pupFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b87a3c"/><stop offset="1" stop-color="#8f5524"/></linearGradient>
        <radialGradient id="pupEar" cx=".5" cy=".2" r=".9"><stop offset="0" stop-color="#c07a3a"/><stop offset="1" stop-color="#7a4318"/></radialGradient>
        <radialGradient id="pupIris" cx=".4" cy=".35" r=".65"><stop offset="0" stop-color="#9a5a2a"/><stop offset=".7" stop-color="#4a2410"/><stop offset="1" stop-color="#22100a"/></radialGradient>
        <!-- turtle -->
        <radialGradient id="ttShell" cx=".45" cy=".25" r=".85"><stop offset="0" stop-color="#c7b058"/><stop offset=".5" stop-color="#8a7a32"/><stop offset="1" stop-color="#4c4218"/></radialGradient>
        <radialGradient id="ttSkin" cx=".45" cy=".3" r=".8"><stop offset="0" stop-color="#b9c58a"/><stop offset=".6" stop-color="#86955a"/><stop offset="1" stop-color="#56633a"/></radialGradient>
        <linearGradient id="ttFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76844c"/><stop offset="1" stop-color="#4e5a32"/></linearGradient>
        <radialGradient id="ttScute" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#ffeaa0" stop-opacity=".55"/><stop offset="1" stop-color="#ffeaa0" stop-opacity="0"/></radialGradient>
        <!-- snail -->
        <radialGradient id="snSkin" cx=".5" cy=".2" r=".9"><stop offset="0" stop-color="#d9c9ac"/><stop offset=".55" stop-color="#ad9a7e"/><stop offset="1" stop-color="#776652"/></radialGradient>
        <radialGradient id="snShell" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#f0c48a"/><stop offset=".5" stop-color="#b87838"/><stop offset="1" stop-color="#5e3412"/></radialGradient>
        <!-- bee -->
        <radialGradient id="beeAbd" cx=".55" cy=".3" r=".75"><stop offset="0" stop-color="#ffe08a"/><stop offset=".45" stop-color="#f4b42a"/><stop offset="1" stop-color="#a8600c"/></radialGradient>
        <linearGradient id="beeBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3a1c"/><stop offset=".5" stop-color="#3a2410"/><stop offset="1" stop-color="#1e1208"/></linearGradient>
        <radialGradient id="beeThx" cx=".45" cy=".3" r=".7"><stop offset="0" stop-color="#f0c060"/><stop offset=".55" stop-color="#b8782a"/><stop offset="1" stop-color="#5e3812"/></radialGradient>
        <linearGradient id="beeHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a1c10"/><stop offset=".55" stop-color="#4a3018"/><stop offset="1" stop-color="#a8732c"/></linearGradient>
        <radialGradient id="beeEye" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#4a5262"/><stop offset=".5" stop-color="#1b1f28"/><stop offset="1" stop-color="#07080b"/></radialGradient>
        <linearGradient id="beeWing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".8"/><stop offset=".5" stop-color="#d8e6ff" stop-opacity=".45"/><stop offset="1" stop-color="#f1dcff" stop-opacity=".35"/></linearGradient>
        <radialGradient id="pollen" cx=".4" cy=".3" r=".7"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#e08a1c"/></radialGradient>
        <!-- dragon -->
        <radialGradient id="drScale" cx=".45" cy=".25" r=".85"><stop offset="0" stop-color="#86d68f"/><stop offset=".5" stop-color="#3f9a57"/><stop offset="1" stop-color="#1c5530"/></radialGradient>
        <linearGradient id="drBelly" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4e6b0"/><stop offset="1" stop-color="#c4ab62"/></linearGradient>
        <linearGradient id="drWing" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3e9a74" stop-opacity=".95"/><stop offset="1" stop-color="#1f5e4a" stop-opacity=".9"/></linearGradient>
        <linearGradient id="drHorn" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f6ecd0"/><stop offset="1" stop-color="#9c8458"/></linearGradient>
        <radialGradient id="drEye" cx=".45" cy=".45" r=".6"><stop offset="0" stop-color="#fff2a0"/><stop offset=".6" stop-color="#ffb22e"/><stop offset="1" stop-color="#c25a0a"/></radialGradient>
        <!-- ghost -->
        <linearGradient id="ghBody" x1=".6" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".97"/><stop offset=".55" stop-color="#e8eefa" stop-opacity=".9"/><stop offset="1" stop-color="#c9d5ec" stop-opacity="0"/></linearGradient>
        <radialGradient id="ghEye" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#05070c"/><stop offset=".8" stop-color="#1d2433"/><stop offset="1" stop-color="#3a4560"/></radialGradient>
      </defs>
      <ellipse id="shadow" cx="0" cy="40" rx="26" ry="3.2" fill="url(#shadowG)"/>

      <!-- critter: a red panda, standing -->
      <g id="body-critter">
        <g data-limb="legF" data-p="-5 25" fill="#2e1810">
          <path d="M -9.5 24 C -10 30, -9.5 35, -8.5 37.5 C -8 40.2, -5.5 40.3, -2 40.3 L 1.5 40.3 Q 3.2 40 2.2 38.4 C 1 37, -0.5 36.5, -1 34 C -0.5 30, 0 27, -0.4 23 Z"/>
        </g>
        <g data-limb="tail" data-p="-10 22" filter="url(#fur)">
          <path class="ln" d="M -10 23 C -22 21, -31 26, -34 33 C -35.5 36.5, -33 39, -29.5 38.5" stroke="#cf6a32" stroke-width="10"/>
          <path d="M -10 23 C -22 21, -31 26, -34 33 C -35.5 36.5, -33 39, -29.5 38.5" fill="none" stroke="#7e3214" stroke-width="10.2" stroke-dasharray="3.6 4.6" stroke-dashoffset="-3"/>
        </g>
        <path filter="url(#fur)" fill="url(#rpFur)" d="M -14 8 C -14 -4, -6 -8, 3 -8 C 12 -8, 17 -2, 17 8 C 17 20, 12 30, 2 30.5 C -9 31, -15 22, -14 8 Z"/>
        <path filter="url(#fur)" fill="url(#rpDark)" d="M 8 -4 C 15 -1, 17 6, 16.5 12 C 16 22, 11 29, 4 30 C 9 22, 10 10, 8 -4 Z"/>
        <g data-limb="legN" data-p="5 25" fill="url(#rpDark)">
          <path d="M 0.5 24 C 0 30, 0.5 35, 1.5 37.5 C 2 40.2, 4.5 40.3, 8 40.3 L 11.5 40.3 Q 13.2 40 12.2 38.4 C 11 37, 9.5 36.5, 9 34 C 9.5 30, 10 27, 9.6 23 Z"/>
        </g>
        <path d="M -8 -24 C -11 -30, -9 -36, -4 -37 C 0 -37.5, 2 -33, 1.5 -29 Z" fill="url(#rpFur)" stroke="#f8f1e8" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M -6.2 -26.5 C -7.6 -30, -6.4 -33.6, -4 -34.2 C -2 -34.6, -0.8 -32, -1.2 -29.6 Z" fill="#3a1f16"/>
        <path d="M 11 -30.5 C 13 -35.5, 18.5 -37.5, 21 -34 C 23 -31, 21.5 -26.5, 19.5 -24.5 Z" fill="url(#rpFur)" stroke="#f8f1e8" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M 13.4 -30 C 15 -33.4, 18.4 -34.8, 19.8 -32.6 C 20.8 -30.8, 20 -28.4, 18.8 -27 Z" fill="#3a1f16"/>
        <path filter="url(#fur)" fill="url(#rpFur)" d="M -10 -16 C -10 -27, -2 -32, 6 -32 C 15 -32, 22 -26, 22.5 -17 C 23 -9, 17 -3, 7 -3 C -3 -3, -10 -7, -10 -16 Z"/>
        <path filter="url(#fur)" fill="#f8f1e8" d="M -10 -13 C -12 -10, -11 -6, -7 -4.5 C -5 -6, -4.5 -9, -6 -12 Z"/>
        <path filter="url(#fur)" fill="#f8f1e8" d="M 9 -12 C 12 -15, 19 -15, 22.5 -12 C 24 -8.5, 21.5 -3.8, 16 -3.4 C 11 -3, 8 -8, 9 -12 Z"/>
        <ellipse cx="2" cy="-22.5" rx="2.8" ry="1.7" fill="#f8f1e8" filter="url(#fur)"/>
        <ellipse cx="13.6" cy="-23.6" rx="2.2" ry="1.4" fill="#f8f1e8" filter="url(#fur)"/>
        <path class="ln" d="M 3.6 -14.6 C 4.4 -11, 6.4 -8.4, 9.4 -6.6 M 13.8 -15.4 C 14 -13, 14.6 -11.6, 15.6 -10.8" stroke="#8a3414" stroke-width="2.2" opacity=".75"/>
        <g class="eo">
          <circle cx="3.6" cy="-17.2" r="2.9" fill="url(#rpEye)"/>
          <circle cx="4.5" cy="-18.4" r=".95" fill="#fff"/>
          <circle cx="2.9" cy="-16.2" r=".4" fill="#fff" opacity=".7"/>
          <circle cx="13.6" cy="-17.8" r="2.4" fill="url(#rpEye)"/>
          <circle cx="14.3" cy="-18.8" r=".8" fill="#fff"/>
        </g>
        <g class="es ln" stroke="#26130c" stroke-width="1.1"><path d="M 0.8 -17.2 Q 3.6 -14.8 6.4 -17.2"/><path d="M 11.4 -17.8 Q 13.6 -15.8 15.8 -17.8"/></g>
        <g class="ex ln" stroke="#26130c" stroke-width="1.1"><path d="M 1.2 -19.4 L 6 -17.2 L 1.2 -15"/><path d="M 15.6 -20 L 11.6 -17.8 L 15.6 -15.6"/></g>
        <path d="M 18.6 -12.6 C 19.6 -13.6, 22.2 -13.6, 22.9 -12.4 C 23.3 -11.2, 21.8 -9.8, 20.8 -9.6 C 19.6 -9.8, 18.2 -11.4, 18.6 -12.6 Z" fill="#1d120d"/>
        <ellipse cx="20.6" cy="-12.4" rx=".9" ry=".4" fill="#fff" opacity=".5"/>
        <g class="ln" stroke="#2b1610" stroke-width=".9">
          <path data-states="calm" d="M 20.8 -9.6 L 20.6 -8 C 19.5 -6.6, 17.6 -6.6, 16.6 -7.4 M 20.6 -8 C 21.3 -6.9, 22.2 -6.8, 23 -7.4"/>
          <g data-states="done">
            <path d="M 20.8 -9.6 L 20.6 -8"/>
            <path d="M 16.6 -7.6 C 17.6 -3, 22 -3, 23.2 -7.4 C 20.5 -6.4, 18.6 -6.4, 16.6 -7.6 Z" fill="#5a1f1a"/>
            <ellipse cx="19.9" cy="-5" rx="1.7" ry="1" fill="#e8737f" stroke="none"/>
          </g>
          <g data-states="waiting"><path d="M 20.8 -9.6 L 20.6 -8"/><ellipse cx="20.2" cy="-6.2" rx="1.2" ry="1.5" fill="#5a1f1a"/></g>
          <path data-states="error" d="M 20.8 -9.6 L 20.6 -8 M 17 -5.8 C 18.6 -7.6, 21.4 -7.6, 23 -6"/>
        </g>
        <g data-limb="armN" data-p="9 1" fill="url(#rpDark)">
          <path d="M 6 -1 C 5.5 6, 6.5 13, 8.5 18 C 9.5 21, 13.5 21, 14 18 C 14.4 13, 13.4 6, 12 -1 Z"/>
        </g>
      </g>

      <!-- robot -->
      <g id="body-robot" style="display:none">
        <g data-limb="legF" data-p="-7 22">
          <rect x="-10" y="20" width="6" height="11" rx="2.5" fill="url(#robFar)"/>
          <circle cx="-7" cy="31" r="3" fill="url(#robJoint)"/>
          <rect x="-9.5" y="31" width="5" height="6.5" rx="2" fill="url(#robFar)"/>
          <rect x="-12.5" y="36.4" width="13" height="3.9" rx="1.8" fill="#4d5665"/>
        </g>
        <rect x="-1.5" y="-9.5" width="9" height="7.5" rx="2" fill="url(#robJoint)"/>
        <path class="ln" d="M -1.5 -7 L 7.5 -7 M -1.5 -4.6 L 7.5 -4.6" stroke="#8a95a6" stroke-width=".7"/>
        <rect x="-18" y="-3.5" width="35" height="28.5" rx="8" fill="url(#robBody)" stroke="#5e6878" stroke-width=".8"/>
        <path class="ln" d="M -17.5 5 L 16.5 5" stroke="#6c7686" stroke-width=".6" opacity=".7"/>
        <path class="ln" d="M -14 9 L -6 9 M -14 12 L -6 12 M -14 15 L -6 15" stroke="#7d8898" stroke-width="1.2"/>
        <rect x="-1" y="7.5" width="15" height="13" rx="3" fill="#2a323e" stroke="#59636f" stroke-width=".6"/>
        <circle cx="3" cy="11" r="1.1" fill="#3ddc84"/>
        <circle cx="6.5" cy="11" r="1.1" fill="#ffc94a"/>
        <circle cx="10" cy="11" r="1.1" fill="#59d7ff"/>
        <rect data-states="calm" x="1.5" y="14.5" width="10" height="3.2" rx="1.6" fill="#3ddc84"/>
        <rect data-states="done" x="1.5" y="14.5" width="10" height="3.2" rx="1.6" fill="#59d7ff"/>
        <rect data-states="waiting" class="beacon" x="1.5" y="14.5" width="10" height="3.2" rx="1.6" fill="#ffc94a"/>
        <rect data-states="error" class="beacon" x="1.5" y="14.5" width="10" height="3.2" rx="1.6" fill="#ff5a5a"/>
        <g fill="#8d98a8"><circle cx="-14.6" cy="0" r=".8"/><circle cx="13.6" cy="0" r=".8"/><circle cx="-14.6" cy="21.6" r=".8"/><circle cx="13.6" cy="21.6" r=".8"/></g>
        <rect x="-14" y="-2.4" width="26" height="3" rx="1.5" fill="#fff" opacity=".5" filter="url(#soft)"/>
        <g data-limb="legN" data-p="5 22">
          <rect x="2" y="20" width="6" height="11" rx="2.5" fill="url(#robLimb)"/>
          <circle cx="5" cy="31" r="3" fill="url(#robJoint)"/>
          <rect x="2.5" y="31" width="5" height="6.5" rx="2" fill="url(#robLimb)"/>
          <rect x="-0.5" y="36.4" width="13" height="3.9" rx="1.8" fill="#6b7586"/>
          <circle cx="5" cy="22" r="3.2" fill="url(#robJoint)"/>
        </g>
        <path class="ln" d="M 7 -36 L 7 -43.5" stroke="#8a95a6" stroke-width="1.8"/>
        <circle class="beacon" cx="7" cy="-46" r="4.5" fill="#ff5a4a" opacity=".55" filter="url(#glow)"/>
        <circle cx="7" cy="-46" r="2.6" fill="#ff6a5a"/>
        <circle cx="6.2" cy="-46.8" r=".8" fill="#fff" opacity=".7"/>
        <rect x="-13" y="-36" width="41" height="27.5" rx="9" fill="url(#robBody)" stroke="#5e6878" stroke-width=".8"/>
        <rect x="-8" y="-35" width="28" height="3" rx="1.5" fill="#fff" opacity=".55" filter="url(#soft)"/>
        <circle cx="-6" cy="-22" r="5.2" fill="url(#robLimb)" stroke="#5e6878" stroke-width=".6"/>
        <circle cx="-6" cy="-22" r="2.4" fill="url(#robJoint)"/>
        <rect x="-1" y="-31.5" width="27" height="19" rx="6" fill="url(#robVisor)" stroke="#3a4350" stroke-width=".8"/>

          <path data-states="calm" d="M 9.4 -5.4 Q 11 -4 12.6 -5.4"/>
          <path data-states="done" d="M 8.6 -5.8 Q 11 -0.8 13.6 -5.8 Z" fill="#1d2433"/>
          <ellipse data-states="waiting" cx="11" cy="-4.4" rx="1.5" ry="2" fill="#1d2433"/>
          <path data-states="error" d="M 9.2 -3.8 Q 11 -5.6 12.8 -3.8"/>
        </g>
        <g data-limb="armN" data-p="16 2">
          <path d="M 13 0 C 18 2, 24 6, 27 11 C 28 13, 26 14.5, 24.5 13 C 21 9.5, 16 6, 12.5 5 Z" fill="#f4f7fd" opacity=".92"/>
        </g>
      </g>
    </svg>
    <div id="rig"></div>
  </div>
  <div id="bubble"></div>
  <span id="hint">click your buddy — it talks · change it via “Claude Pulse: Choose Buddy Character”</span>
</div>

<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();
  const char = document.getElementById('char');
  const charimg = document.getElementById('charimg');
  const charsvg = document.getElementById('charsvg');
  const bubble = document.getElementById('bubble');
  const stage = document.getElementById('stage');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);

  const IMG = "{{img}}";
  let imgMode = IMG.length > 0;
  if (imgMode) {
    charimg.onerror = () => {
      // Image gone or unreadable — fall back to the built-in character
      // instead of an invisible buddy.
      imgMode = false;
      charimg.style.display = 'none';
      char.classList.remove('img');
      setFace(data.state);
    };
    charimg.src = IMG;
    charimg.style.display = 'block';
    char.classList.add('img');
  }

  // ---- Character traits -------------------------------------------------
  // kind: biped | quad | flyer | slider. scale sizes the whole character.
  // speed multiplies walking/crawling. leap = chance to grab the ceiling.
  // tail: [sways per second, degrees]. reach: art y of the hands held up,
  // so a hang puts them on the ceiling. shadow: [x, half-width] on the ground.
  const CHARS = {
    critter: { kind: 'biped',  scale: 1,    speed: 1,    leap: 0.55, climb: true,  jumps: true,  tail: [0.5, 5],  reach: -19, shadow: [0, 17] },
    robot:   { kind: 'biped',  scale: 1,    speed: 0.9,  leap: 0.3,  climb: true,  jumps: true,  reach: -18, shadow: [0, 16] },
    cat:     { kind: 'quad',   scale: 1,    speed: 1.1,  leap: 0.85, climb: true,  jumps: true,  tail: [0.35, 8], reach: -5, shadow: [-6, 34] },
    pup:     { kind: 'quad',   scale: 1,    speed: 1.25, leap: 0.6,  climb: true,  jumps: true,  tail: [2, 12],   reach: -5, shadow: [-6, 34] },
    turtle:  { kind: 'quad',   scale: 0.8,  speed: 0.3,  leap: 0.05, climb: false, jumps: true,  reach: -5, shadow: [-3, 36] },
    snail:   { kind: 'slider', scale: 0.55, speed: 0.2,  leap: 0,    climb: true,  jumps: false, climbSpeed: 0.35, blink: false, shadow: [2, 46] },
    bee:     { kind: 'flyer',  scale: 0.7,  ease: 0.06,  retarget: 0.02,  restP: 0.2,  flap: 9,   flapAmp: 32, bobAmp: 4, tricks: true, shadow: [3, 18] },
    dragon:  { kind: 'flyer',  scale: 1.5,  ease: 0.012, retarget: 0.002, restP: 0.4,  flap: 0.9, flapAmp: 18, bobAmp: 5, tail: [0.3, 5], shadow: [-2, 26] },
    ghost:   { kind: 'flyer',  scale: 1,    ease: 0.02,  retarget: 0,     restP: 0.35, flap: 0,   flapAmp: 0,  bobAmp: 3 },
  };
  const CHARACTER = "{{char}}";
  // In image mode the built-in art is hidden; if the image fails to load we
  // fall back to the critter — body AND traits, so the two always agree.
  const charKey = (!imgMode && CHARS[CHARACTER]) ? CHARACTER : 'critter';
  const C = imgMode
    ? { kind: 'biped', scale: 1, speed: 1, leap: 0.5, climb: true, jumps: true }
    : CHARS[charKey];
  const AIR = C.kind === 'flyer';
  const CH = Math.round(78 * (C.scale || 1));   // character box in px
  char.style.width = CH + 'px';
  char.style.height = CH + 'px';

  Object.keys(CHARS).forEach((id) => {
    const el = $('body-' + id);
    if (el) el.style.display = id === charKey ? '' : 'none';
  });
  // ---- Layers -------------------------------------------------------------
  // Each moving part (data-limb, turning about data-p) is lifted out of the
  // body into an <svg> of its own and turned with a CSS transform, so the
  // compositor moves a picture painted once. Turned inside one SVG, every
  // limb's step repainted the whole character — fur, blurs and all — each
  // frame. The parts between moving ones become still layers, in drawing
  // order, so what is in front stays in front.
  const rig = $('rig');
  const LIMB = {};
  function addLayer(nodes, cls) {
    const NS = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', charsvg.getAttribute('viewBox'));
    if (cls) s.setAttribute('class', cls);
    const g = document.createElementNS(NS, 'g');
    if (cls !== 'ground') g.setAttribute('filter', 'url(#lift)');
    nodes.forEach((n) => g.appendChild(n));
    s.appendChild(g);
    rig.appendChild(s);
    // Shrink the layer to what it holds (plus room for shadow, glow and fur):
    // the compositor blends every layer every frame, so empty box costs.
    const b = g.getBBox();
    const box = b.width > 0 || b.height > 0 ? { x: b.x - 8, y: b.y - 8, w: b.width + 16, h: b.height + 16 }
      : { x: -60, y: -80, w: 120, h: 120 };     // hidden (image mode): whole box
    s.setAttribute('viewBox', box.x + ' ' + box.y + ' ' + box.w + ' ' + box.h);
    s.style.left = ((box.x + 60) / 1.2) + '%';
    s.style.top = ((box.y + 80) / 1.2) + '%';
    s.style.width = (box.w / 1.2) + '%';
    s.style.height = (box.h / 1.2) + '%';
    s.box = box;
    return s;
  }
  const shadowEl = $('shadow');
  if (C.shadow) { shadowEl.setAttribute('cx', C.shadow[0]); shadowEl.setAttribute('rx', C.shadow[1]); }
  const SHADOW = addLayer([shadowEl], 'ground');
  if (!C.shadow) SHADOW.style.display = 'none';
  let still = [];
  Array.from($('body-' + charKey).children).forEach((n) => {   // elements only: no layers of whitespace
    const limb = n.getAttribute('data-limb');
    const beacon = n.classList.contains('beacon');   // blinks on its own layer
    if (!limb && !beacon) { still.push(n); return; }
    if (still.length) { addLayer(still); still = []; }
    const s = addLayer([n], beacon ? 'beacon' : '');
    if (limb) {
      // The pivot, from art units to percent of this layer's own box.
      const p = (n.getAttribute('data-p') || '0 0').split(' ').map(Number);
      s.style.transformOrigin = ((p[0] - s.box.x) / s.box.w * 100).toFixed(2) + '% '
        + ((p[1] - s.box.y) / s.box.h * 100).toFixed(2) + '%';
      LIMB[limb] = { s, t: '' };
    }
  });
  if (still.length) addLayer(still);
  // How tall the drawing stands, in px: speech and effects start just above
  // it, not above the empty top of the box. (An image fills its box.)
  const ART = Array.from(rig.children).reduce((h, s) => s.box.w === 120 ? h
    : Math.max(h, Math.round(CH * (40 - (s.box.y + 8)) / 120)), 0) || CH;

  // Geometry helpers derived from the character size.
  const PAD = 6;
  const wallR = (w) => w - CH - PAD;                      // x of the right wall
  const innerR = (w) => w - CH - PAD - 12;                // keep-away for random targets
  const span = (w) => Math.max(1, w - CH - 38);
  const ceilH = () => Math.max(20, stage.clientHeight - CH - 17);
  const maxApex = () => Math.max(12, stage.clientHeight - CH - 22);

  let data = { state: 'idle' };
  let x = 60, targetX = 200, bubbleTimer = null, lastFx = 0;

  const fmt = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const tok = (n) => !n ? '0' : n < 1000 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'k' : (n / 1e6).toFixed(2) + 'M';
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  // Session-derived text (todos, tool, project) goes through innerHTML —
  // escape it so a todo like "fix a<b comparison" can't swallow the bubble.
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function lines() {
    const d = data;
    if (d.state === 'waiting') {
      if (d.reason === 'question') {
        return ['Claude has a <b>question</b> for you — over in the panel!', 'Your opinion is required. I would answer, but I am busy being adorable.'];
      }
      if (d.reason === 'agent') {
        return ['One of Claude’s <b>helpers</b> needs an answer from you.', 'A subagent is stuck waiting on your input — check the panel!'];
      }
      return ['<b>Claude needs your permission!</b> Go press the button.', 'Ding ding! A permission prompt is waiting on you.'];
    }
    if (d.state === 'working') {
      const base = d.todos && d.todos.total
        ? ['<b>' + d.todos.done + '/' + d.todos.total + '</b> steps done — ' + esc(d.todos.active || 'on it') + '.', 'Progress report: <b>' + d.todos.done + '/' + d.todos.total + '</b>. I supervised every one.']
        : ['Claude is on it — <b>' + fmt(d.elapsedMs || 0) + '</b> in.' + (d.tool ? ' Currently: <b>' + esc(d.tool) + '</b>.' : ''), 'Hard at work for <b>' + fmt(d.elapsedMs || 0) + '</b>. I am also working (pacing).'];
      if (d.tokensSession) base.push('This session: <b>' + tok(d.tokensSession) + '</b> tokens out so far.');
      if (d.agents && d.agents.length) {
        const n = d.agents.length;
        const names = d.agents.slice(0, 3).map((a) => esc(a.desc || a.type)).join(', ');
        base.unshift('Claude has <b>' + n + (n === 1 ? ' helper' : ' helpers') + '</b> on it: ' + names + (n > 3 ? '…' : '') + '.');
      }
      return base;
    }
    if (d.state === 'done') {
      return ['Done' + (d.totalMs ? ' in <b>' + fmt(d.totalMs) + '</b>' : '') + '! We are basically unstoppable.', 'Finished! Time for a victory lap.'];
    }
    if (d.state === 'error') {
      return ['Ouch — the response <b>dropped</b>. Check the Claude panel?', 'Connection lost mid-thought. Happens to the best of us.'];
    }
    const idle = ['All quiet' + (d.project ? ' in <b>' + esc(d.project) + '</b>' : '') + '. Send Claude a prompt and I will start pacing!', 'Zzz… oh! Hi. Nothing running right now.'];
    if (d.tokensToday) idle.push('Today so far: <b>' + tok(d.tokensToday) + '</b> tokens out. Busy day!');
    // A calm word about usage is what makes the worried one believable.
    if (d.usage && d.usage.calm) idle.push('Plenty left — your week is <b>' + (d.usage.pct | 0) + '%</b> used.');
    return idle;
  }

  function say(html, ms) {
    bubble.innerHTML = html;
    const bw = Math.max(80, Math.min(320, stage.clientWidth - 20));
    bubble.style.maxWidth = bw + 'px';
    const left = Math.max(6, Math.min(x - 20, stage.clientWidth - bubble.offsetWidth - 8));
    bubble.style.left = left + 'px';
    // Follow the buddy vertically (it may be on a wall, the ceiling, or in
    // the air) and clamp into view — short panels would otherwise clip it.
    const base = Math.min(stage.clientHeight - bubble.offsetHeight - 4, Math.max(ART + 20, y + ART + 14));
    bubble.style.bottom = Math.max(4, base) + 'px';
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms || 4500);
  }

  const NAME = esc("{{name}}") || 'friend';
  if (NAME !== 'friend') {
    $('hint').textContent = NAME + '’s buddy · click it — it talks';
  }
  function cheer() {
    return pick([
      'You’re crushing it, <b>' + NAME + '</b>! 👉 Keep going.',
      'Hey <b>' + NAME + '</b> — future you says thanks for today’s work. 👉',
      'One step at a time, <b>' + NAME + '</b>. You’ve got this! 💪',
      '<b>' + NAME + '</b>, the best debugger in this room is still you. 👉',
      'Proud of you, <b>' + NAME + '</b> — look at this progress! ✨',
      'Breathe. Sip water. Then ship, <b>' + NAME + '</b>. 🚀',
      'Yes, you, <b>' + NAME + '</b> 👉 — the one building cool things.',
    ]);
  }

  let wavingUntil = 0, celebrateUntil = 0, pointUntil = 0;
  char.addEventListener('click', () => {
    // The click that ends a drag is not a poke.
    if (dragged) { dragged = false; return; }
    squish = 0.82;
    const now = performance.now();
    pointUntil = now + 2600;   // stop and point at you
    pauseUntil = Math.max(pauseUntil, now + 2600);
    if (AIR && C.tricks) {
      // Happy loop-de-loop with a burst of hearts.
      if (!reduced) flip = { active: true, start: now, dur: 700, turns: 1 };
      for (let i = 0; i < 3; i++) setTimeout(() => { lastFx = 0; fx('💛', i * 12 - 12); }, i * 160);
    }
    say(cheer() + '<span class="sub">' + pick(lines()) + '</span>', 6500);
    vscode.postMessage({ type: 'poke' });
  });

  function fx(txt, dx, bottomPx) {
    const now = Date.now();
    if (now - lastFx < 900) return;
    lastFx = now;
    const el = document.createElement('span');
    el.className = 'fx';
    el.textContent = txt;
    el.style.left = (x + CH * 0.28 + (dx || 0)) + 'px';
    // Default: above the buddy's head (follows it up walls/ceiling).
    el.style.bottom = (bottomPx !== undefined ? bottomPx : ART + 10 + y) + 'px';
    stage.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  }

  // ---- Face ---------------------------------------------------------------
  // Each body draws its own eyes three ways — .eo open, .es shut, .ex dazed —
  // and marks the pieces that belong to one mood with data-states.
  const each = (sel, fn) => rig.querySelectorAll(sel).forEach(fn);
  let eyeMode = '', blinkUntil = 0, nextBlink = 2500;
  function setEyes(mode) {
    if (imgMode || mode === eyeMode) return;
    eyeMode = mode;
    each('.eo', (el) => { el.style.display = mode === 'open' ? 'inline' : 'none'; });
    each('.es', (el) => { el.style.display = mode === 'shut' ? 'inline' : 'none'; });
    each('.ex', (el) => { el.style.display = mode === 'dazed' ? 'inline' : 'none'; });
  }
  function setFace(state) {
    if (imgMode) return;
    const mood = state === 'waiting' || state === 'done' || state === 'error' ? state : 'calm';
    each('[data-states]', (el) => {
      el.style.display = el.getAttribute('data-states').split(' ').indexOf(mood) >= 0 ? 'inline' : 'none';
    });
    setEyes(state === 'error' ? 'dazed' : 'open');
  }

  let bobT = 0, dir = 1, moving = false, squish = 1;
  let y = 0, vy = 0;
  let flip = { active: false, start: 0, dur: 0, turns: 1 };

  function applyTransform(ts) {
    const grounded = y <= 0.5;
    const bob = (grounded && !AIR) ? Math.sin(bobT * 2.2) * -2.5 : Math.sin(bobT * 1.8) * -(C.bobAmp || 3);
    let rot = 0;
    const onSurface = Math.abs(surfCur) > 1 || surfTarget !== 0;
    if (activity === 'hang' || held) {
      rot = Math.sin(bobT * 2) * 7;                   // pendulum from the hands
    } else if (onSurface) {
      // Climbing a wall or crawling the ceiling — orientation follows the surface.
      rot = surfCur + (activity === 'climb' && moving ? Math.sin(bobT * 9) * 4 : 0);
    } else if (flip.active) {
      const p = Math.min(1, (ts - flip.start) / flip.dur);
      rot = 360 * flip.turns * p * dir;
      if (p >= 1) flip.active = false;
    } else if (!grounded && !AIR) {
      // No lean during a flip's last airborne frames — 360° ≡ 0°, land clean.
      rot = activity === 'flip' ? 0 : -vy * 3 * dir;
    } else if (moving) {
      rot = AIR ? dir * 4 : activity === 'dash' ? 10 * dir : Math.sin(bobT * 9) * (C.kind === 'slider' ? 2 : 6);
    }
    if (AIR && airMode === 'waggle') rot += Math.sin(bobT * 14) * 14;   // dance wobble
    squish += (1 - squish) * 0.18;
    // Hanging: the raised hands sit well below the top of the box. Lift it so
    // the hands are what touches the ceiling, and swing from them.
    const hang = activity === 'hang' && C.reach !== undefined;
    const handsPct = hang ? (C.reach + 80) / 1.2 : 0;    // viewBox y -80..40 → 0..100%
    const lift = hang
      ? Math.max(0, stage.clientHeight - 1 - FLOOR - y - CH * (1 - handsPct / 100))
      : 0;
    // The art fills the lower two thirds of the box; 67% is its middle.
    char.style.transformOrigin = (activity === 'hang' || held) ? '50% ' + handsPct.toFixed(1) + '%'
      : onSurface ? '50% 50%'
      : (activity === 'flip' || flip.active || !grounded) ? '50% 67%' : '50% 100%';
    char.style.transform =
      'translateY(' + (bob - y - lift).toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg)' +
      ' scaleX(' + (dir * squish).toFixed(3) + ') scaleY(' + squish.toFixed(3) + ')';
    // Contact shadow: on the floor only, fading as it leaves the ground.
    const onFloor = !held && !onSurface && activity !== 'hang' && (!AIR || y < 3);
    const op = onFloor ? Math.max(0, 1 - y / 30).toFixed(2) : '0.00';
    if (op !== SHADOW.dataset.op) { SHADOW.dataset.op = op; SHADOW.style.opacity = op; }
  }

  let lastTs = 0, pauseUntil = 0, walkMul = 1, walkA = 0;
  let targetY = 0, activity = 'walk', hopsLeft = 0;
  let climb = null, surfCur = 0, surfTarget = 0;
  let leap = null, hangUntil = 0, dropRoll = false;
  let airMode = 'fly', airPlan = null;   // flyers: fly | hover | waggle | flower | nap
  const GRAV = 0.5; // px per frame², frame = 16.7ms
  const canJump = C.jumps !== false, canClimb = C.climb !== false;
  const leapSkill = C.leap || 0;

  // ---- Picked up and put down ---------------------------------------------
  // Drag the character off whatever it is covering. It dangles while carried,
  // and once let go it stays put for STAY_MS (ten minutes unless the host
  // sets PULSE_STAY_MS) instead of wandering straight back. A walker let go
  // in mid-air drops to the floor first.
  const STAY_MS = window.PULSE_STAY_MS > 0 ? window.PULSE_STAY_MS : 600000;
  const FLOOR = 11;                       // #char's bottom offset in the stage
  const topY = () => AIR ? maxApex() : ceilH();
  let held = false, grab = null, dragged = false, parkUntil = 0;

  function pickUp() {
    held = true;
    activity = 'held';
    climb = null; leap = null; vy = 0; hopsLeft = 0; airPlan = null; airMode = 'fly';
    flip.active = false; dropRoll = false; surfTarget = 0; surfCur = 0;
    pauseUntil = 0; pointUntil = 0; parkUntil = 0; squish = 0.85;
    char.style.cursor = 'grabbing';
    vscode.postMessage({ type: 'grab' });
  }

  // Also the host's way to place it — on another screen, say. Everything a
  // hand-off could leave half-done is reset, as in enterAt().
  function dropAt(x0, y0) {
    const w = Math.max(120, stage.clientWidth);
    const ts = performance.now();
    held = false; grab = null;
    char.style.cursor = '';
    x = Math.max(4, Math.min(x0, wallR(w)));
    y = Math.max(0, Math.min(y0, topY()));
    vy = 0; climb = null; leap = null; hopsLeft = 0; airPlan = null;
    flip.active = false; dropRoll = false; surfTarget = 0; surfCur = 0;
    targetX = x; targetY = y;
    parkUntil = ts + STAY_MS;
    if (AIR) { airMode = 'hover'; startRest(ts, STAY_MS); }
    else if (y > 0.5) activity = 'drop';    // lands, then scheduleNext() parks it
    else startRest(ts, STAY_MS);
  }

  char.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    dragged = false;
    grab = { id: e.pointerId, sx: e.clientX, sy: e.clientY,
             gx: e.clientX - x, gy: (stage.clientHeight - FLOOR - y) - e.clientY };
    try { char.setPointerCapture(e.pointerId); } catch (err) {}
  });
  char.addEventListener('pointermove', (e) => {
    if (!grab || e.pointerId !== grab.id) return;
    if (!held) {
      // A few pixels of wobble is still a click.
      if (Math.hypot(e.clientX - grab.sx, e.clientY - grab.sy) < 5) return;
      pickUp();
    }
    const w = Math.max(120, stage.clientWidth);
    x = Math.max(4, Math.min(e.clientX - grab.gx, wallR(w)));
    y = Math.max(0, Math.min(stage.clientHeight - FLOOR - e.clientY - grab.gy, topY()));
  });
  function letGo(e) {
    if (!grab || e.pointerId !== grab.id) return;
    const g = grab;
    grab = null;
    if (!held) return;
    dragged = true;
    dropAt(x, y);
    if ((AIR || y <= 0.5) && Math.random() < 0.4) {
      say(pick(['I’ll wait over here.', 'Better view from here anyway.', 'Fine — this spot is nice too.']), 2500);
    }
    // The host may carry it on to the screen the pointer was let go over.
    vscode.postMessage({ type: 'drop', gx: g.gx, gy: g.gy });
  }
  char.addEventListener('pointerup', letGo);
  char.addEventListener('pointercancel', letGo);

  // Mostly short random hops, sometimes a long walk — with a fresh pace each
  // time, so the wandering doesn't read as edge-to-edge ping-pong.
  function pickTarget(w) {
    if (Math.random() < 0.6) {
      const hop = (40 + Math.random() * 90) * (Math.random() < 0.5 ? -1 : 1);
      targetX = Math.max(20, Math.min(innerR(w), x + hop));
    } else {
      targetX = 20 + Math.random() * span(w);
    }
    walkMul = 0.7 + Math.random() * 0.6;
  }

  function jump(power, withFlip, ts) {
    if (reduced) return;
    vy = power;
    y = Math.max(y, 0.6); // leave the ground this frame
    if (withFlip) {
      flip = { active: true, start: ts, dur: (2 * power / GRAV) * 16.7, turns: Math.random() < 0.25 ? 2 : 1 };
    }
  }

  function startRest(ts, ms) { activity = 'rest'; pauseUntil = ts + ms; }
  function startWalk(w) { activity = 'walk'; pickTarget(w); }
  function startDash(w) { activity = 'dash'; targetX = x < w / 2 ? innerR(w) : 20; }
  function startHops(w, ts) { activity = 'hops'; hopsLeft = 2 + Math.floor(Math.random() * 3); pickTarget(w); jump(3 + Math.random() * 1.5, false, ts); }
  function startFlipJump(ts) {
    activity = 'flip'; targetX = x;
    const apex = Math.min(maxApex(), 45 + Math.random() * 70);
    jump(Math.sqrt(2 * GRAV * apex), true, ts);
  }
  function startClimb(w) {
    activity = 'climb';
    const side = Math.random() < 0.5 ? -1 : 1;   // -1 = left wall, 1 = right wall
    climb = { phase: 'approach', side };
    targetX = side < 0 ? 4 : wallR(w);
  }
  // Crouch, then leap for the ceiling. Success is decided up front by the
  // character's skill; a miss peaks visibly short and tumbles back down.
  function startLeap(ts, w) {
    if (ceilH() < 30) { startWalk(w); return; }
    activity = 'leap'; targetX = x; squish = 0.8;
    leap = { phase: 'crouch', until: ts + 350, success: Math.random() < leapSkill };
  }

  // What to do next, weighted by Claude's state and what this character can
  // actually do — energetic while working, acrobatic when done, lazy when idle.
  function scheduleNext(ts) {
    // Put somewhere by hand: stay there until the time is up.
    if (ts < parkUntil) { startRest(ts, parkUntil - ts); return; }
    const w = Math.max(120, stage.clientWidth);
    const s = data.state;
    const opts = [];
    const add = (wt, fn) => { if (wt > 0) opts.push([wt, fn]); };
    const walk = () => startWalk(w), dash = () => startDash(w), hops = () => startHops(w, ts);
    const flipJ = () => startFlipJump(ts), clmb = () => startClimb(w), lp = () => startLeap(ts, w);
    if (s === 'idle') {
      add(40, walk); add(canJump ? 12 : 0, hops); add(canJump ? 6 : 0, flipJ);
      add(canClimb ? 10 : 0, clmb); add(canJump ? 10 : 0, lp);
      add(22, () => startRest(ts, 1800 + Math.random() * 4500));
    } else if (s === 'working') {
      add(28, walk); add(16, dash); add(canJump ? 16 : 0, hops); add(canJump ? 10 : 0, flipJ);
      add(canClimb ? 10 : 0, clmb); add(canJump ? 10 : 0, lp);
      add(10, () => startRest(ts, 250 + Math.random() * 800));
    } else if (s === 'done') {
      add(canJump ? 30 : 0, hops); add(canJump ? 25 : 0, flipJ); add(canClimb ? 13 : 0, clmb);
      add(canJump ? 17 : 0, lp); add(15, walk); add(canJump ? 0 : 20, dash);
    } else {
      add(60, walk); add(40, () => startRest(ts, 300 + Math.random() * 600));
    }
    let r = Math.random() * opts.reduce((a, o) => a + o[0], 0);
    for (const [wt, fn] of opts) { r -= wt; if (r <= 0) { fn(); return; } }
    opts[opts.length - 1][1]();
  }

  function pickAirTarget(w) {
    targetX = 20 + Math.random() * span(w);
    // The whole height of wherever it lives — a short editor panel or a full
    // desktop screen — minus a margin so it doesn't hug the ceiling.
    targetY = Math.random() * maxApex() * 0.92;
  }

  function setLimbs(ts) {
    const grounded = y <= 0.5 || activity === 'climb';
    // Near arm counter-swings the near leg; gestures override `ar` below.
    let al = -walkA * 0.7, ar = -walkA * 0.7;
    let ll = walkA, lr = -walkA, gesture = false;
    if (!grounded && !AIR) {
      ll = 24; lr = -24;                              // tuck legs in the air
      al = flip.active ? 140 : 35; ar = flip.active ? -140 : -35;
    }
    if (activity === 'leap' && !grounded) {
      al = 170; ar = -170; ll = 8; lr = -8; gesture = true;   // reaching for the ceiling
    } else if (activity === 'hang') {
      const k = Math.sin(bobT * 2.5) * 12;
      al = 178; ar = -178; ll = k; lr = -k; gesture = true;   // holding on, legs dangling
    } else if (held) {
      const k = Math.sin(bobT * 9) * 20;
      al = 150; ar = -150 + k * 0.4; ll = k; lr = -k; gesture = true;   // carried: arms up, legs kicking
    }
    if (ts < pointUntil) {
      ar = -92 + Math.sin(bobT * 3) * 4;              // arm out, pointing at you
      if (activity !== 'hang') al = 0;
      gesture = true;
    } else if (data.state === 'waiting' && activity !== 'hang') {
      const f = Math.sin(bobT * 12) * 14;
      al = 150 + f; ar = -150 - f; gesture = true;    // both arms up, flailing
    } else if (ts < celebrateUntil) {
      al = 160; ar = -160; gesture = true;            // victory arms
    } else if (ts < wavingUntil) {
      ar = -145 + Math.sin(bobT * 16) * 18; gesture = true; // hello wave
    }
    // Profile rig: the art faces +x, so negative rotation swings a limb
    // forward/up. `ar` carries the gesture pose for the visible front arm.
    // Each part turns its own layer about the pivot its drawing names.
    const R = (name, a) => {
      const l = LIMB[name];
      if (!l) return;
      const t = 'rotate(' + a.toFixed(1) + 'deg)';
      if (t !== l.t) { l.t = t; l.s.style.transform = t; }
    };
    if (C.kind === 'biped') {
      R('legN', ll); R('legF', lr);
      // Carries walk swing, air pose, and gestures. A raised near arm would
      // cross the face, so gestures lift it forward, in front of the muzzle;
      // only a hang reaches straight up.
      R('armN', activity === 'hang' || ar >= -95 ? ar : -95 + (ar + 95) * 0.45);
    } else if (C.kind === 'quad') {
      // Diagonal gait: front-near with back-far, front-far with back-near.
      // The front-near paw doubles as the gesture arm: lifted forward the way
      // a cat paws at something, straight up only to hang on.
      const fn = !gesture ? (grounded ? walkA : -20)
        : activity === 'hang' ? Math.max(-150, ar)
        : Math.max(-62, Math.min(-38, -48 + (ar + 150) * 0.5));   // keeps the wave's wiggle
      const ff = held ? -ll : grounded ? -walkA : -20;
      const bn = held ? -ll : grounded ? -walkA : 15, bf = held ? ll : grounded ? walkA : 15;
      R('qfn', fn); R('qff', ff);
      R('qbn', bn); R('qbf', bf);
    } else if (C.kind === 'flyer') {
      if (C.flap) {
        // Both wings beat together; they fold while napping on the floor.
        const a = airMode === 'nap' ? 0 : Math.sin(bobT * C.flap * 6.283) * C.flapAmp + (moving ? 8 : 0);
        R('wingN', a); R('wingF', a * 0.9);
      }
      // Ghost arm: gentle float pose unless a gesture is active.
      R('armN', gesture ? ar : -18 - Math.sin(bobT * 1.8) * 6);
      // Antennae bob, legs dangle and kick while flying.
      R('antN', Math.sin(bobT * 3) * 8);
      R('antF', Math.sin(bobT * 3 + 1) * 8);
      const dg = moving ? Math.sin(bobT * 7) * 12 : Math.sin(bobT * 2) * 4;
      R('dangle', dg); R('dangleF', dg * 0.8);
    }
    if (C.tail) {
      // A slow sway, quicker and wider when excited — the pup wags.
      const happy = data.state === 'done' || data.state === 'waiting' || ts < celebrateUntil || ts < pointUntil;
      R('tail', Math.sin(bobT * 6.283 * C.tail[0] * (happy ? 2.5 : 1)) * C.tail[1] * (happy ? 1.5 : 1));
    }
    R('ear', walkA * 0.25 + Math.sin(bobT * 2) * 2);   // floppy ear
  }

  function loop(ts) {
    bobT = ts / 1000;
    // Scale by real elapsed time so speed is identical on 60Hz and 120Hz.
    const dt = lastTs ? Math.min(100, ts - lastTs) : 16.7;
    lastTs = ts;
    const steps = dt / 16.7;
    const w = Math.max(120, stage.clientWidth);
    const speed = (data.state === 'working' ? 1.6 : data.state === 'done' ? 1.0 : data.state === 'idle' ? 0.35 : 0.5)
      * walkMul * (C.speed || 1) * (activity === 'dash' ? 3.2 : 1);
    const resting = ts < pauseUntil || ts < pointUntil;
    // Re-clamp targets to the current panel size — a resize mid-walk would
    // otherwise leave an unreachable target pinning the buddy to the wall.
    targetX = Math.max(4, Math.min(targetX, wallR(w)));
    targetY = Math.max(0, Math.min(targetY, maxApex()));

    if (held) {
      moving = false;                       // the pointer moves it
    } else if (AIR) {
      // Flyers own the whole area: free 2D flight. Bees zip and re-decide
      // constantly; the dragon glides; the ghost drifts.
      moving = !reduced && !resting;
      if (!resting && airMode !== 'fly') airMode = 'fly';
      if (moving) {
        const dx = targetX - x, dy2 = targetY - y;
        const arrived = Math.hypot(dx, dy2) < 6;
        if (arrived || (!airPlan && Math.random() < (C.retarget || 0) * steps)) {
          if (arrived && airPlan === 'flower') {
            // Found a flower: hover over it for a bit, shedding hearts.
            lastFx = 0; fx('🌼', CH * 0.15, 12);   // on the floor, under the bee
            airMode = 'flower'; airPlan = null;
            startRest(ts, 1500 + Math.random() * 2000);
          } else if (arrived && airPlan === 'nap') {
            airMode = 'nap'; airPlan = null;
            startRest(ts, 2500 + Math.random() * 4000);
          } else if (arrived && Math.random() < (C.restP || 0.3)) {
            if (C.tricks && Math.random() < 0.5) { airMode = 'waggle'; startRest(ts, 1200 + Math.random() * 1500); }
            else { airMode = 'hover'; startRest(ts, 800 + Math.random() * 2500); }
          } else if (C.tricks && Math.random() < 0.3) {
            // Plan something cute: land for a nap when idle, or visit a flower.
            if (data.state === 'idle' && Math.random() < 0.5) { airPlan = 'nap'; targetY = 0; }
            else { airPlan = 'flower'; targetY = 3; }
            targetX = 20 + Math.random() * span(w);
          } else {
            pickAirTarget(w);
          }
        } else {
          if (Math.abs(dx) > 3) dir = dx > 0 ? 1 : -1;
          const ease = Math.min(1, (C.ease || 0.02) * steps);
          x += dx * ease; y += dy2 * ease;
          // Loop-de-loop mid-flight.
          if (C.tricks && !flip.active && Math.random() < 0.004 * steps) flip = { active: true, start: ts, dur: 650, turns: 1 };
          if (C.tricks && Math.random() < 0.008 * steps) fx('bzz', -CH * 0.25);
        }
      }
      if (airMode === 'waggle' && resting) x += Math.sin(bobT * 14) * 1.2 * steps;   // the waggle dance
      if (airMode === 'flower' && resting && Math.random() < 0.02 * steps) fx('💛', CH * 0.3);
    } else if (activity === 'climb' && climb) {
      // Wall climbing and upside-down ceiling crawling.
      moving = !reduced && !resting;
      const ceilY = ceilH();
      if (moving) {
        const cs = 0.9 * walkMul * (C.climbSpeed || C.speed || 1) * steps;
        if (climb.phase === 'approach') {
          const step = speed * steps;
          if (Math.abs(targetX - x) <= step) { x = targetX; climb.phase = 'up'; }
          else { dir = targetX > x ? 1 : -1; x += dir * step; }
        } else if (climb.phase === 'up') {
          // Re-pin to the wall each frame — the panel may resize mid-climb.
          x = targetX = climb.side < 0 ? 4 : wallR(w);
          y += cs;
          if (y >= ceilY) {
            y = ceilY; climb.phase = 'ceil';
            climb.exitMode = (Math.random() < 0.5 && canJump) ? 'drop' : 'across';
            targetX = climb.exitMode === 'across'
              ? (climb.side < 0 ? wallR(w) : 4)
              : 30 + Math.random() * Math.max(1, w - CH - 62);
          }
        } else if (climb.phase === 'ceil') {
          y = ceilY; // stay glued to the ceiling through resizes, both directions
          const step = 0.8 * walkMul * (C.climbSpeed || C.speed || 1) * steps;
          if (Math.abs(targetX - x) <= step) {
            x = targetX;
            if (climb.exitMode === 'across') climb.phase = 'down';
            else { climb = null; activity = 'drop'; dropRoll = true; vy = 0; surfTarget = 360; } // let go!
          } else { dir = targetX > x ? 1 : -1; x += dir * step; }
        } else if (climb.phase === 'down') {
          x = targetX = climb.side < 0 ? wallR(w) : 4; // descending the opposite wall
          y -= cs;
          if (y <= 0) { y = 0; climb = null; surfTarget = 0; scheduleNext(ts); }
        }
      }
      if (climb) {
        surfTarget = climb.phase === 'ceil' ? 180
          : climb.phase === 'up' ? (climb.side < 0 ? 90 : -90)
          : climb.phase === 'down' ? (climb.side < 0 ? -90 : 90)
          : 0;
      }
    } else if (activity === 'hang') {
      // Hanging from the ceiling by the hands, swinging. Then: pull up and
      // crawl away, or let go.
      moving = false;
      y = ceilH();
      if (!resting && ts >= hangUntil) {
        if (Math.random() < 0.55 && canClimb) {
          const side = Math.random() < 0.5 ? -1 : 1;
          activity = 'climb';
          climb = { phase: 'ceil', side, exitMode: Math.random() < 0.5 ? 'drop' : 'across' };
          targetX = climb.exitMode === 'across' ? (side < 0 ? wallR(w) : 4) : 30 + Math.random() * Math.max(1, w - CH - 62);
        } else {
          activity = 'drop'; dropRoll = false; vy = 0;
        }
      }
    } else {
      moving = !reduced && !resting && Math.abs(targetX - x) > 0.5 && activity !== 'flip' && activity !== 'drop' && activity !== 'leap';
      // Leap: crouch briefly, then launch at the ceiling.
      if (activity === 'leap' && leap && leap.phase === 'crouch' && !resting && ts >= leap.until) {
        leap.phase = 'air';
        const ceil = ceilH();
        const apex = leap.success ? ceil + 8 : ceil * (0.55 + Math.random() * 0.35);
        jump(Math.sqrt(2 * GRAV * apex), false, ts);
      }
      if (moving) {
        const step = speed * steps;
        if (Math.abs(targetX - x) <= step) {
          x = targetX;
          if (y <= 0.5) scheduleNext(ts);
        } else {
          dir = targetX > x ? 1 : -1;
          x += dir * step;
          // Occasionally change its mind mid-walk.
          if (activity === 'walk' && Math.random() < 0.003 * steps) pickTarget(w);
        }
      } else if (resting) {
        if (data.state === 'idle' && Math.random() < 0.006 * steps) dir = -dir; // glance around
      } else if (!reduced && y <= 0.5 && vy <= 0 && activity !== 'flip' && activity !== 'drop' && activity !== 'leap') {
        // Rest expired (or a degenerate target) with nothing queued — the
        // scheduler must run again or the buddy freezes here forever.
        scheduleNext(ts);
      }
      // Jump / fall physics.
      if (y > 0 || vy > 0) {
        y += vy * steps;
        vy -= GRAV * steps;
        const ceil = ceilH();
        if (activity === 'leap' && leap && leap.success && vy > 0 && y >= ceil - 3) {
          // Grabbed the ceiling!
          y = ceil; vy = 0; leap = null; activity = 'hang';
          hangUntil = ts + 2000 + Math.random() * 3000;
          lastFx = 0; fx('✨', 30);
          if (Math.random() < 0.35) say(pick(['Nailed it! 💪', 'Look at me go!', 'Ceiling: conquered.']), 2500);
        } else {
          if (y > ceil) { y = ceil; vy = Math.min(vy, 0); }
          if (y <= 0) {
            y = 0; vy = 0; squish = 0.78; flip.active = false;
            if (activity === 'hops') {
              if (hopsLeft > 0) { hopsLeft--; jump(3 + Math.random() * 1.5, false, ts); }
              else scheduleNext(ts);
            } else if (activity === 'leap' && leap && leap.phase === 'air') {
              // Missed — tumble, see stars, dust off.
              leap = null; squish = 0.62; lastFx = 0; fx('💫', 30);
              if (Math.random() < 0.4) say(pick(['So close!', 'Gravity: 1, me: 0.', 'I meant to do that.', 'Next time, ceiling.']), 2500);
              startRest(ts, 1200 + Math.random() * 800);
            } else if (activity === 'flip' || activity === 'drop') {
              // Normalize the leftover roll so it eases the last few degrees to 0
              // in the same spin direction — short falls would otherwise pop.
              if (activity === 'drop' && dropRoll) surfCur -= 360;
              surfTarget = 0; dropRoll = false;
              scheduleNext(ts);
            }
          }
        }
      } else if (canJump && !reduced && !resting && data.state === 'waiting' && activity !== 'leap' && Math.random() < 0.05 * steps) {
        jump(4.5, false, ts);                         // urgent bouncing
      }
    }
    surfCur += (surfTarget - surfCur) * Math.min(1, 0.15 * steps);
    // Flyers: keep inside the panel vertically through resizes.
    if (AIR) y = Math.max(0, Math.min(y, maxApex()));

    // Walk cycle: legs step while walking on the floor OR crawling a surface.
    const legsActive = !AIR && moving && (y <= 0.5 || activity === 'climb');
    const gait = C.kind === 'quad' ? 22 : 26;
    walkA += ((legsActive ? Math.sin(bobT * (C.speed < 0.5 ? 5 : 10)) * (activity === 'climb' ? 18 : gait) : 0) - walkA) * Math.min(1, 0.25 * steps);
    // Eyes close while resting between strolls, blink now and then otherwise.
    const nap = data.state === 'idle' && ts < pauseUntil && ts >= pointUntil;
    if (ts >= nextBlink) { blinkUntil = ts + 140; nextBlink = ts + 2500 + Math.random() * 4500; }
    setEyes(data.state === 'error' ? 'dazed'
      : (nap || (C.blink !== false && ts < blinkUntil)) ? 'shut' : 'open');
    x = Math.max(4, Math.min(x, wallR(w)));
    char.style.left = x + 'px';
    applyTransform(ts);
    setLimbs(ts);
    if (data.state === 'working' && Math.random() < 0.006 * steps) fx('⚙', CH * 0.4);
    if (activity === 'dash' && moving && Math.random() < 0.05 * steps) fx('💨', dir < 0 ? CH * 0.8 : -CH * 0.3);
    if (data.state === 'idle' && (ts < pauseUntil || reduced) && Math.random() < 0.01 * steps) fx('z', CH * 0.45);
    if (data.state === 'waiting' && Math.random() < 0.02 * steps) fx('!', CH * 0.4);
    requestAnimationFrame(loop);
  }

  let gotFirst = false;
  let lastUsageStep = '';

  window.addEventListener('message', (e) => {
    const prev = data.state;
    data = (e.data && e.data.state) ? e.data : data;
    if (data.state !== prev) {
      setFace(data.state);
      // The first message after (re)load is a baseline, not a transition —
      // don't replay bubbles/confetti every time the view reopens.
      if (gotFirst) {
        if (data.state === 'waiting') say(pick(lines()), 7000);
        if (data.state === 'done') { celebrateUntil = performance.now() + 1800; say(pick(lines()), 3500); for (let i = 0; i < 5; i++) setTimeout(() => { lastFx = 0; fx(pick(['🎉','✨','⭐']), i * 14 - 28); }, i * 120); }
        if (data.state === 'error') say(pick(lines()), 6000);
      }
    }
    // Usage warnings, spoken once per step rather than on every poll. The
    // character is the thing on screen people actually look at, so it gets to
    // mention a limit before anything louder has to.
    const u = data.usage;
    if (gotFirst && u && u.kind) {
      // Keyed on the tier alone. With the percentage in the key, the live
      // estimate ticking up a point — every few minutes while you work —
      // counted as something new to say, so the character re-delivered the
      // same warning with a particle burst for the rest of the week.
      // A reminder that belongs to one pause in one chat carries an id, so the
      // next pause is something new to say and the same one never is.
      const step = u.kind + ':' + (u.tier || 0) + (u.id ? ':' + u.id : '');
      if (step !== lastUsageStep) {
        lastUsageStep = step;
        say(usageLine(u), 9000);
        if (u.tier >= 2) fx(u.kind === 'compact' ? '🧹' : u.kind === 'away' ? '⏳' : '⚠', CH * 0.4);
      }
    }
    if (!gotFirst) wavingUntil = performance.now() + 1500; // hello wave on open
    gotFirst = true;
  });

  /* Built here, not by the host, so every piece goes through esc() and the
     wording stays in one place with the rest of the character's voice. */
  function usageLine(u) {
    const until = u.until ? '<b>' + esc(u.until) + '</b>' : 'a while';
    if (u.kind === 'blocked') {
      return NAME + ', Claude is out of usage for now — back in ' + until + '. Nothing to do but wait.';
    }
    if (u.kind === 'compact') {
      return NAME + ', this chat is <b>' + esc(u.ctx || '') + '</b> now, and every reply re-reads all of it. '
        + 'Type <b>/compact</b> and the next ones get cheap again.';
    }
    // A big chat about to go cold: after `by`, the next message reloads it all.
    if (u.kind === 'away') {
      const chat = '<b>' + esc(u.project || 'that chat') + '</b>';
      const by = '<b>' + esc(u.by || 'long') + '</b>';
      return u.waiting
        ? NAME + ', ' + chat + ' is still waiting for your answer. Reply before ' + by
          + ' — after that it has to load all <b>' + esc(u.ctx || '') + '</b> again.'
        : NAME + ', stepping away? ' + chat + ' holds <b>' + esc(u.ctx || '') + '</b>. Type <b>/compact</b> there before '
          + by + ', or coming back to it costs a full reload.';
    }
    if (u.kind === 'session') {
      return NAME + ', the 5-hour window is <b>' + (u.pct | 0) + '%</b> used. It refills in ' + until
        + ' — good moment for a tea.';
    }
    // A per-model window is a slice of the week, so it says which slice
    // rather than claiming the whole week is that far gone.
    if (u.what) {
      return NAME + ', your <b>' + esc(u.what) + '</b> is <b>' + (u.pct | 0) + '%</b> used, refilling in '
        + until + '. Your week overall has more left than that.';
    }
    return NAME + ', your week is <b>' + (u.pct | 0) + '%</b> used and refills in ' + until + '. Pace yourself!';
  }

  // ---- Host hooks (macOS multi-screen crossing) --------------------------
  // Called by the native host through evaluateJavaScript; unused in VS Code.
  // Keeping the state reset HERE means the host never has to know which
  // variables exist — a stale 'flip'/'drop'/airPlan left behind by a hand-off
  // used to freeze the character at the screen edge.
  function steerToEdge(edge) {                // -1 = left wall, +1 = right wall
    if (held) return;                         // in someone's hand: not going anywhere
    const w = Math.max(120, stage.clientWidth);
    pauseUntil = 0; pointUntil = 0; parkUntil = 0;
    if (AIR) {
      airPlan = null; airMode = 'fly';
      targetX = edge > 0 ? wallR(w) : 4; targetY = y;
      return;
    }
    if (activity === 'climb' || activity === 'leap' || activity === 'hang') {
      climb = null; leap = null; surfTarget = 0; vy = 0;
      activity = y > 0.5 ? 'drop' : 'dash';
    } else if (y <= 0.5) {
      activity = 'dash'; flip.active = false; hopsLeft = 0;   // hurry, no detours
    }
    targetX = edge > 0 ? wallR(w) : 4;
  }
  function enterAt(x0, y0, tx) {
    const w = Math.max(120, stage.clientWidth);
    x = Math.max(4, Math.min(x0, wallR(w)));
    y = AIR ? Math.max(0, Math.min(y0, maxApex())) : 0;
    vy = 0; pauseUntil = 0; pointUntil = 0; parkUntil = 0;
    held = false; grab = null; char.style.cursor = '';
    climb = null; leap = null; surfTarget = 0; surfCur = 0;
    flip.active = false; dropRoll = false; hopsLeft = 0;
    airPlan = null; airMode = 'fly';
    activity = 'walk';
    targetX = Math.max(20, Math.min(tx, innerR(w))); targetY = y;
  }

  setFace('idle');
  vscode.postMessage({ type: 'hello' });
  requestAnimationFrame(loop);
</script>
</body>
</html>
