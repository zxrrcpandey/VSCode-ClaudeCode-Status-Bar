<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src {{csp}} data:; script-src 'nonce-{{nonce}}';">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  #stage {
    position: relative; width: 100%; height: 100%;
    font-family: -apple-system, "Segoe UI", sans-serif;
    user-select: none;
  }
  #floor {
    position: absolute; left: 0; right: 0; bottom: 10px; height: 1px;
    background: var(--vscode-editorWidget-border, rgba(128,128,128,.35));
  }
  #char {
    position: absolute; bottom: 11px; width: 78px; height: 78px;
    cursor: pointer; transform-origin: 50% 100%;
    transition: filter .2s;
  }
  #char:hover { filter: brightness(1.1); }
  #char svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #charimg {
    display: none; width: 100%; height: 100%;
    object-fit: contain; object-position: bottom;
    image-rendering: auto; pointer-events: none;
  }
  .ear { fill: #d99347; }
  .earin { fill: #b8763a; }
  #body { fill: #f2b366; }
  .cheek { fill: rgba(226, 120, 100, .45); }
  .eye { fill: #ffffff; }
  .pupil { fill: #3a2c18; }
  #mouth { stroke: #3a2c18; stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .xeye { stroke: #3a2c18; stroke-width: 2.6; stroke-linecap: round; display: none; }
  .lid { stroke: #3a2c18; stroke-width: 2.6; stroke-linecap: round; display: none; }

  #bubble {
    position: absolute; max-width: 320px;
    background: var(--vscode-editorWidget-background, #252526);
    color: var(--vscode-editorWidget-foreground, #ccc);
    border: 1px solid var(--vscode-editorWidget-border, #454545);
    border-radius: 10px; padding: 9px 12px;
    font-size: 12.5px; line-height: 1.45;
    opacity: 0; transition: opacity .18s; pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: ""; position: absolute; bottom: -6px; left: 26px;
    width: 10px; height: 10px; transform: rotate(45deg);
    background: inherit;
    border-right: 1px solid var(--vscode-editorWidget-border, #454545);
    border-bottom: 1px solid var(--vscode-editorWidget-border, #454545);
  }
  #bubble b { color: var(--vscode-textLink-foreground, #4daafc); }
  #bubble .sub {
    display: block; margin-top: 4px;
    color: var(--vscode-descriptionForeground, #999); font-size: 11.5px;
  }

  .fx {
    position: absolute; font-size: 13px; pointer-events: none;
    animation: floatup 1.6s ease-out forwards;
  }
  @keyframes floatup {
    from { opacity: .95; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-34px); }
  }
  #hint {
    position: absolute; right: 10px; bottom: 16px;
    font-size: 11px; color: var(--vscode-descriptionForeground, #888);
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { .fx { animation-duration: .01s; } }
</style>
</head>
<body>
<div id="stage">
  <div id="floor"></div>
  <div id="char" title="Click me!">
    <img id="charimg" alt="buddy">
    <svg id="charsvg" viewBox="-60 -60 120 120">
      <g id="limbs" fill="#d99347">
        <!-- biped -->
        <g id="legl"><rect x="-17" y="18" width="8" height="17" rx="4"/></g>
        <g id="legr"><rect x="9" y="18" width="8" height="17" rx="4"/></g>
        <g id="arml"><rect x="-33" y="0" width="8" height="24" rx="4"/></g>
        <g id="armr"><rect x="25" y="0" width="8" height="24" rx="4"/></g>
        <!-- quadruped: front-left, back-left, back-right, front-right -->
        <g id="qfl"><rect x="-30" y="16" width="8" height="18" rx="4"/></g>
        <g id="qbl"><rect x="-14" y="18" width="8" height="16" rx="4"/></g>
        <g id="qbr"><rect x="6" y="18" width="8" height="16" rx="4"/></g>
        <g id="qfr"><rect x="22" y="16" width="8" height="18" rx="4"/></g>
        <!-- small insect wings -->
        <g id="wingl"><ellipse cx="-24" cy="-16" rx="20" ry="8" fill="#ffffff" fill-opacity=".75" stroke="#c9d3e3" stroke-width="1.2" transform="rotate(-28 -6 -10)"/></g>
        <g id="wingr"><ellipse cx="24" cy="-16" rx="20" ry="8" fill="#ffffff" fill-opacity=".75" stroke="#c9d3e3" stroke-width="1.2" transform="rotate(28 6 -10)"/></g>
        <!-- big dragon wings -->
        <g id="dwingl"><path d="M -8 -6 L -48 -40 L -54 -10 L -46 12 L -24 16 L -8 4 Z" fill="#3f7a50" stroke="#2f5e3c" stroke-width="1.5"/></g>
        <g id="dwingr"><path d="M 8 -6 L 48 -40 L 54 -10 L 46 12 L 24 16 L 8 4 Z" fill="#3f7a50" stroke="#2f5e3c" stroke-width="1.5"/></g>
      </g>
      <g id="body-critter">
        <circle class="ear" cx="-17" cy="-25" r="10"/>
        <circle class="ear" cx="17" cy="-25" r="10"/>
        <circle class="earin" cx="-17" cy="-25" r="4.5"/>
        <circle class="earin" cx="17" cy="-25" r="4.5"/>
        <ellipse id="body" cx="0" cy="3" rx="30" ry="28"/>
      </g>
      <g id="body-robot" style="display:none">
        <line x1="0" y1="-42" x2="0" y2="-27" stroke="#8a97a8" stroke-width="3"/>
        <circle cx="0" cy="-46" r="5" fill="#e06c5a"/>
        <rect x="-30" y="-27" width="60" height="57" rx="12" fill="#aab6c6"/>
        <rect x="-24" y="-20" width="48" height="36" rx="8" fill="#3d4654"/>
      </g>
      <g id="body-cat" style="display:none">
        <path d="M 25 16 Q 47 12 43 -8" stroke="#848a94" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M -27 -12 L -21 -35 L -7 -20 Z" fill="#848a94"/>
        <path d="M 27 -12 L 21 -35 L 7 -20 Z" fill="#848a94"/>
        <path d="M -22 -17 L -19 -28 L -12 -21 Z" fill="#e8b6c0"/>
        <path d="M 22 -17 L 19 -28 L 12 -21 Z" fill="#e8b6c0"/>
        <ellipse cx="0" cy="3" rx="29" ry="27" fill="#9aa0aa"/>
      </g>
      <g id="body-ghost" style="display:none">
        <path d="M -28 31 L -28 -2 A 28 28 0 0 1 28 -2 L 28 31 L 18.5 23 L 9.5 31 L 0 23 L -9.5 31 L -18.5 23 Z" fill="#dfe6f2" stroke="#b9c4d8" stroke-width="1.5"/>
      </g>
      <g id="body-pup" style="display:none">
        <path d="M 30 6 Q 48 0 44 -16" stroke="#a9764f" stroke-width="7" fill="none" stroke-linecap="round"/>
        <ellipse cx="-27" cy="-12" rx="8" ry="16" fill="#a9764f" transform="rotate(18 -27 -12)"/>
        <ellipse cx="27" cy="-12" rx="8" ry="16" fill="#a9764f" transform="rotate(-18 27 -12)"/>
        <ellipse cx="0" cy="6" rx="32" ry="25" fill="#c9956a"/>
        <ellipse cx="0" cy="13" rx="11" ry="7" fill="#ecd2b6"/>
      </g>
      <g id="body-turtle" style="display:none">
        <path d="M -34 10 A 34 34 0 0 1 34 10 Z" fill="#6fa36b" stroke="#557f52" stroke-width="1.5"/>
        <circle cx="0" cy="-14" r="7" fill="#557f52" fill-opacity=".55"/>
        <circle cx="-16" cy="-4" r="6" fill="#557f52" fill-opacity=".55"/>
        <circle cx="16" cy="-4" r="6" fill="#557f52" fill-opacity=".55"/>
        <ellipse cx="0" cy="14" rx="24" ry="15" fill="#a8c98a"/>
      </g>
      <g id="body-bee" style="display:none">
        <line x1="-8" y1="-16" x2="-15" y2="-31" stroke="#2b2b2b" stroke-width="2"/>
        <line x1="8" y1="-16" x2="15" y2="-31" stroke="#2b2b2b" stroke-width="2"/>
        <circle cx="-15" cy="-32" r="3" fill="#2b2b2b"/>
        <circle cx="15" cy="-32" r="3" fill="#2b2b2b"/>
        <ellipse cx="0" cy="6" rx="26" ry="23" fill="#f2c94c"/>
        <ellipse cx="0" cy="12" rx="25" ry="4.5" fill="#2b2b2b"/>
        <ellipse cx="0" cy="22" rx="19" ry="4" fill="#2b2b2b"/>
        <path d="M -4 28 L 4 28 L 0 38 Z" fill="#2b2b2b"/>
      </g>
      <g id="body-dragon" style="display:none">
        <path d="M 28 12 Q 52 18 48 -6" stroke="#5fa86f" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M 44 -2 L 54 -12 L 40 -12 Z" fill="#5fa86f"/>
        <path d="M -14 -24 L -19 -42 L -6 -30 Z" fill="#e9d7a0"/>
        <path d="M 14 -24 L 19 -42 L 6 -30 Z" fill="#e9d7a0"/>
        <ellipse cx="0" cy="4" rx="30" ry="27" fill="#5fa86f"/>
        <ellipse cx="0" cy="13" rx="18" ry="13" fill="#bfe3a8"/>
      </g>
      <!-- head on +x: dir=+1 means moving right, so the face leads -->
      <g id="body-snail" style="display:none">
        <ellipse cx="8" cy="22" rx="36" ry="11" fill="#b9c97a"/>
        <circle cx="30" cy="8" r="15" fill="#b9c97a"/>
        <circle cx="-14" cy="0" r="23" fill="#c98d5a" stroke="#a56f3f" stroke-width="1.5"/>
        <circle cx="-14" cy="0" r="14" fill="none" stroke="#a56f3f" stroke-width="2.5"/>
        <circle cx="-14" cy="0" r="6" fill="none" stroke="#a56f3f" stroke-width="2.5"/>
      </g>
      <g id="face">
        <circle class="cheek" cx="-17" cy="6" r="5"/>
        <circle class="cheek" cx="17" cy="6" r="5"/>
        <circle class="eye" cx="-10" cy="-5" r="6.5"/>
        <circle class="eye" cx="10" cy="-5" r="6.5"/>
        <circle class="pupil" id="pl" cx="-9" cy="-5" r="3"/>
        <circle class="pupil" id="pr" cx="11" cy="-5" r="3"/>
        <line class="lid" id="lidl" x1="-15" y1="-5" x2="-5" y2="-5"/>
        <line class="lid" id="lidr" x1="5" y1="-5" x2="15" y2="-5"/>
        <g class="xeye" id="xl"><line x1="-14" y1="-9" x2="-6" y2="-1"/><line x1="-6" y1="-9" x2="-14" y2="-1"/></g>
        <g class="xeye" id="xr"><line x1="6" y1="-9" x2="14" y2="-1"/><line x1="14" y1="-9" x2="6" y2="-1"/></g>
        <path id="mouth" d="M -7 9 Q 0 14 7 9"/>
      </g>
    </svg>
  </div>
  <div id="bubble"></div>
  <span id="hint">click your buddy — it talks · change it via “Claude Pulse: Choose Buddy Character”</span>
</div>

<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();
  const char = document.getElementById('char');
  const charimg = document.getElementById('charimg');
  const charsvg = document.getElementById('charsvg');
  const bubble = document.getElementById('bubble');
  const stage = document.getElementById('stage');
  const mouth = document.getElementById('mouth');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);

  const IMG = "{{img}}";
  let imgMode = IMG.length > 0;
  if (imgMode) {
    charimg.onerror = () => {
      // Image gone or unreadable — fall back to the built-in character
      // instead of an invisible buddy.
      imgMode = false;
      charimg.style.display = 'none';
      charsvg.style.display = '';
      setFace(data.state);
    };
    charimg.src = IMG;
    charimg.style.display = 'block';
    charsvg.style.display = 'none';
  }

  // ---- Character traits -------------------------------------------------
  // kind: biped | quad | flyer | slider. scale sizes the whole character.
  // speed multiplies walking/crawling. leap = chance to grab the ceiling.
  const CHARS = {
    critter: { kind: 'biped',  scale: 1,    speed: 1,    leap: 0.55, climb: true,  jumps: true,  limb: '#d99347' },
    robot:   { kind: 'biped',  scale: 1,    speed: 0.9,  leap: 0.3,  climb: true,  jumps: true,  limb: '#8a97a8' },
    cat:     { kind: 'biped',  scale: 1,    speed: 1.1,  leap: 0.85, climb: true,  jumps: true,  limb: '#848a94' },
    pup:     { kind: 'quad',   scale: 1,    speed: 1.25, leap: 0.6,  climb: true,  jumps: true,  limb: '#a9764f' },
    turtle:  { kind: 'quad',   scale: 0.8,  speed: 0.3,  leap: 0.05, climb: false, jumps: true,  limb: '#8fb072', face: [0, 4, 0.9] },
    snail:   { kind: 'slider', scale: 0.55, speed: 0.2,  leap: 0,    climb: true,  jumps: false, climbSpeed: 0.35, face: [30, 10, 0.72] },
    bee:     { kind: 'flyer',  scale: 0.5,  ease: 0.06,  retarget: 0.02,  restP: 0.12, flap: 9,   flapAmp: 32, bobAmp: 4, wings: 'small', face: [0, -2, 0.9] },
    dragon:  { kind: 'flyer',  scale: 1.5,  ease: 0.012, retarget: 0.002, restP: 0.4,  flap: 0.9, flapAmp: 18, bobAmp: 5, wings: 'big',   face: [0, -4, 1] },
    ghost:   { kind: 'flyer',  scale: 1,    ease: 0.02,  retarget: 0,     restP: 0.35, flap: 0,   flapAmp: 0,  bobAmp: 3, wings: 'none', arms: true, limb: '#c6d1e4' },
  };
  const CHARACTER = "{{char}}";
  // In image mode the built-in art is hidden; if the image fails to load we
  // fall back to the critter — body AND traits, so the two always agree.
  const charKey = (!imgMode && CHARS[CHARACTER]) ? CHARACTER : 'critter';
  const C = imgMode
    ? { kind: 'biped', scale: 1, speed: 1, leap: 0.5, climb: true, jumps: true }
    : CHARS[charKey];
  const AIR = C.kind === 'flyer';
  const CH = Math.round(78 * (C.scale || 1));   // character box in px
  char.style.width = CH + 'px';
  char.style.height = CH + 'px';

  Object.keys(CHARS).forEach((id) => {
    const el = $('body-' + id);
    if (el) el.style.display = id === charKey ? '' : 'none';
  });
  if (C.face) $('face').setAttribute('transform', 'translate(' + C.face[0] + ' ' + C.face[1] + ') scale(' + C.face[2] + ')');
  $('limbs').setAttribute('fill', C.limb || '#d99347');
  const LIMB_SETS = {
    biped:  ['legl', 'legr', 'arml', 'armr'],
    quad:   ['qfl', 'qbl', 'qbr', 'qfr'],
    flyer:  (C.wings === 'small' ? ['wingl', 'wingr'] : C.wings === 'big' ? ['dwingl', 'dwingr'] : [])
              .concat(C.arms ? ['arml', 'armr'] : []),
    slider: [],
  };
  const visibleLimbs = LIMB_SETS[C.kind] || LIMB_SETS.biped;
  ['legl', 'legr', 'arml', 'armr', 'qfl', 'qbl', 'qbr', 'qfr', 'wingl', 'wingr', 'dwingl', 'dwingr']
    .forEach((id) => { $(id).style.display = visibleLimbs.indexOf(id) >= 0 ? '' : 'none'; });

  // Geometry helpers derived from the character size.
  const PAD = 6;
  const wallR = (w) => w - CH - PAD;                      // x of the right wall
  const innerR = (w) => w - CH - PAD - 12;                // keep-away for random targets
  const span = (w) => Math.max(1, w - CH - 38);
  const ceilH = () => Math.max(20, stage.clientHeight - CH - 17);
  const maxApex = () => Math.max(12, stage.clientHeight - CH - 22);

  let data = { state: 'idle' };
  let x = 60, targetX = 200, bubbleTimer = null, lastFx = 0;

  const fmt = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const tok = (n) => !n ? '0' : n < 1000 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'k' : (n / 1e6).toFixed(2) + 'M';
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  // Session-derived text (todos, tool, project) goes through innerHTML —
  // escape it so a todo like "fix a<b comparison" can't swallow the bubble.
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function lines() {
    const d = data;
    if (d.state === 'waiting') {
      return d.reason === 'question'
        ? ['Claude has a <b>question</b> for you — over in the panel!', 'Your opinion is required. I would answer, but I am busy being adorable.']
        : ['<b>Claude needs your permission!</b> Go press the button.', 'Ding ding! A permission prompt is waiting on you.'];
    }
    if (d.state === 'working') {
      const base = d.todos && d.todos.total
        ? ['<b>' + d.todos.done + '/' + d.todos.total + '</b> steps done — ' + esc(d.todos.active || 'on it') + '.', 'Progress report: <b>' + d.todos.done + '/' + d.todos.total + '</b>. I supervised every one.']
        : ['Claude is on it — <b>' + fmt(d.elapsedMs || 0) + '</b> in.' + (d.tool ? ' Currently: <b>' + esc(d.tool) + '</b>.' : ''), 'Hard at work for <b>' + fmt(d.elapsedMs || 0) + '</b>. I am also working (pacing).'];
      if (d.tokensSession) base.push('This session: <b>' + tok(d.tokensSession) + '</b> tokens out so far.');
      return base;
    }
    if (d.state === 'done') {
      return ['Done' + (d.totalMs ? ' in <b>' + fmt(d.totalMs) + '</b>' : '') + '! We are basically unstoppable.', 'Finished! Time for a victory lap.'];
    }
    if (d.state === 'error') {
      return ['Ouch — the response <b>dropped</b>. Check the Claude panel?', 'Connection lost mid-thought. Happens to the best of us.'];
    }
    const idle = ['All quiet' + (d.project ? ' in <b>' + esc(d.project) + '</b>' : '') + '. Send Claude a prompt and I will start pacing!', 'Zzz… oh! Hi. Nothing running right now.'];
    if (d.tokensToday) idle.push('Today so far: <b>' + tok(d.tokensToday) + '</b> tokens out. Busy day!');
    return idle;
  }

  function say(html, ms) {
    bubble.innerHTML = html;
    const bw = Math.max(80, Math.min(320, stage.clientWidth - 20));
    bubble.style.maxWidth = bw + 'px';
    const left = Math.max(6, Math.min(x - 20, stage.clientWidth - bubble.offsetWidth - 8));
    bubble.style.left = left + 'px';
    // Follow the buddy vertically (it may be on a wall, the ceiling, or in
    // the air) and clamp into view — short panels would otherwise clip it.
    const base = Math.min(stage.clientHeight - bubble.offsetHeight - 4, Math.max(CH + 20, y + CH + 14));
    bubble.style.bottom = Math.max(4, base) + 'px';
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms || 4500);
  }

  const NAME = esc("{{name}}") || 'friend';
  if (NAME !== 'friend') {
    $('hint').textContent = NAME + '’s buddy · click it — it talks';
  }
  function cheer() {
    return pick([
      'You’re crushing it, <b>' + NAME + '</b>! 👉 Keep going.',
      'Hey <b>' + NAME + '</b> — future you says thanks for today’s work. 👉',
      'One step at a time, <b>' + NAME + '</b>. You’ve got this! 💪',
      '<b>' + NAME + '</b>, the best debugger in this room is still you. 👉',
      'Proud of you, <b>' + NAME + '</b> — look at this progress! ✨',
      'Breathe. Sip water. Then ship, <b>' + NAME + '</b>. 🚀',
      'Yes, you, <b>' + NAME + '</b> 👉 — the one building cool things.',
    ]);
  }

  let wavingUntil = 0, celebrateUntil = 0, pointUntil = 0;
  char.addEventListener('click', () => {
    squish = 0.82;
    const now = performance.now();
    pointUntil = now + 2600;   // stop and point at you
    pauseUntil = now + 2600;
    say(cheer() + '<span class="sub">' + pick(lines()) + '</span>', 6500);
    vscode.postMessage({ type: 'poke' });
  });

  function fx(txt, dx) {
    const now = Date.now();
    if (now - lastFx < 900) return;
    lastFx = now;
    const el = document.createElement('span');
    el.className = 'fx';
    el.textContent = txt;
    el.style.left = (x + CH * 0.28 + (dx || 0)) + 'px';
    el.style.bottom = (CH + 10 + y) + 'px';   // follow the buddy up walls/ceiling
    stage.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  }

  const show = (id, on) => $(id).style.display = on ? '' : 'none';
  let napping = false;
  // Eyes close only while resting between strolls (or on error).
  function setNap(on) {
    if (imgMode || napping === on) return;
    napping = on;
    const dead = data.state === 'error';
    show('lidl', on && !dead); show('lidr', on && !dead);
    show('pl', !on && !dead); show('pr', !on && !dead);
  }
  function setFace(state) {
    if (imgMode) return;
    const dead = state === 'error';
    show('xl', dead); show('xr', dead);
    show('lidl', false); show('lidr', false);
    show('pl', !dead); show('pr', !dead);
    napping = false;
    mouth.setAttribute('d',
      state === 'done' ? 'M -8 7 Q 0 16 8 7' :
      state === 'error' ? 'M -7 12 Q 0 7 7 12' :
      state === 'waiting' ? 'M -4 9 Q 0 13 4 9' : 'M -7 9 Q 0 14 7 9');
  }

  let bobT = 0, dir = 1, moving = false, squish = 1;
  let y = 0, vy = 0;
  let flip = { active: false, start: 0, dur: 0, turns: 1 };

  function applyTransform(ts) {
    const grounded = y <= 0.5;
    const bob = (grounded && !AIR) ? Math.sin(bobT * 2.2) * -2.5 : Math.sin(bobT * 1.8) * -(C.bobAmp || 3);
    let rot = 0;
    const onSurface = Math.abs(surfCur) > 1 || surfTarget !== 0;
    if (activity === 'hang') {
      rot = Math.sin(bobT * 2) * 7;                   // pendulum from the hands
    } else if (onSurface) {
      // Climbing a wall or crawling the ceiling — orientation follows the surface.
      rot = surfCur + (activity === 'climb' && moving ? Math.sin(bobT * 9) * 4 : 0);
    } else if (flip.active) {
      const p = Math.min(1, (ts - flip.start) / flip.dur);
      rot = 360 * flip.turns * p * dir;
      if (p >= 1) flip.active = false;
    } else if (!grounded && !AIR) {
      // No lean during a flip's last airborne frames — 360° ≡ 0°, land clean.
      rot = activity === 'flip' ? 0 : -vy * 3 * dir;
    } else if (moving) {
      rot = AIR ? dir * 4 : activity === 'dash' ? 10 * dir : Math.sin(bobT * 9) * (C.kind === 'slider' ? 2 : 6);
    }
    squish += (1 - squish) * 0.18;
    char.style.transformOrigin = activity === 'hang' ? '50% 0%'
      : (activity === 'flip' || onSurface || !grounded) ? '50% 50%' : '50% 100%';
    char.style.transform =
      'translateY(' + (bob - y).toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg)' +
      ' scaleX(' + (dir * squish).toFixed(3) + ') scaleY(' + squish.toFixed(3) + ')';
  }

  let lastTs = 0, pauseUntil = 0, walkMul = 1, walkA = 0;
  let targetY = 0, activity = 'walk', hopsLeft = 0;
  let climb = null, surfCur = 0, surfTarget = 0;
  let leap = null, hangUntil = 0, dropRoll = false;
  const GRAV = 0.5; // px per frame², frame = 16.7ms
  const canJump = C.jumps !== false, canClimb = C.climb !== false;
  const leapSkill = C.leap || 0;

  // Mostly short random hops, sometimes a long walk — with a fresh pace each
  // time, so the wandering doesn't read as edge-to-edge ping-pong.
  function pickTarget(w) {
    if (Math.random() < 0.6) {
      const hop = (40 + Math.random() * 90) * (Math.random() < 0.5 ? -1 : 1);
      targetX = Math.max(20, Math.min(innerR(w), x + hop));
    } else {
      targetX = 20 + Math.random() * span(w);
    }
    walkMul = 0.7 + Math.random() * 0.6;
  }

  function jump(power, withFlip, ts) {
    if (reduced) return;
    vy = power;
    y = Math.max(y, 0.6); // leave the ground this frame
    if (withFlip) {
      flip = { active: true, start: ts, dur: (2 * power / GRAV) * 16.7, turns: Math.random() < 0.25 ? 2 : 1 };
    }
  }

  function startRest(ts, ms) { activity = 'rest'; pauseUntil = ts + ms; }
  function startWalk(w) { activity = 'walk'; pickTarget(w); }
  function startDash(w) { activity = 'dash'; targetX = x < w / 2 ? innerR(w) : 20; }
  function startHops(w, ts) { activity = 'hops'; hopsLeft = 2 + Math.floor(Math.random() * 3); pickTarget(w); jump(3 + Math.random() * 1.5, false, ts); }
  function startFlipJump(ts) {
    activity = 'flip'; targetX = x;
    const apex = Math.min(maxApex(), 45 + Math.random() * 70);
    jump(Math.sqrt(2 * GRAV * apex), true, ts);
  }
  function startClimb(w) {
    activity = 'climb';
    const side = Math.random() < 0.5 ? -1 : 1;   // -1 = left wall, 1 = right wall
    climb = { phase: 'approach', side };
    targetX = side < 0 ? 4 : wallR(w);
  }
  // Crouch, then leap for the ceiling. Success is decided up front by the
  // character's skill; a miss peaks visibly short and tumbles back down.
  function startLeap(ts, w) {
    if (ceilH() < 30) { startWalk(w); return; }
    activity = 'leap'; targetX = x; squish = 0.8;
    leap = { phase: 'crouch', until: ts + 350, success: Math.random() < leapSkill };
  }

  // What to do next, weighted by Claude's state and what this character can
  // actually do — energetic while working, acrobatic when done, lazy when idle.
  function scheduleNext(ts) {
    const w = Math.max(120, stage.clientWidth);
    const s = data.state;
    const opts = [];
    const add = (wt, fn) => { if (wt > 0) opts.push([wt, fn]); };
    const walk = () => startWalk(w), dash = () => startDash(w), hops = () => startHops(w, ts);
    const flipJ = () => startFlipJump(ts), clmb = () => startClimb(w), lp = () => startLeap(ts, w);
    if (s === 'idle') {
      add(40, walk); add(canJump ? 12 : 0, hops); add(canJump ? 6 : 0, flipJ);
      add(canClimb ? 10 : 0, clmb); add(canJump ? 10 : 0, lp);
      add(22, () => startRest(ts, 1800 + Math.random() * 4500));
    } else if (s === 'working') {
      add(28, walk); add(16, dash); add(canJump ? 16 : 0, hops); add(canJump ? 10 : 0, flipJ);
      add(canClimb ? 10 : 0, clmb); add(canJump ? 10 : 0, lp);
      add(10, () => startRest(ts, 250 + Math.random() * 800));
    } else if (s === 'done') {
      add(canJump ? 30 : 0, hops); add(canJump ? 25 : 0, flipJ); add(canClimb ? 13 : 0, clmb);
      add(canJump ? 17 : 0, lp); add(15, walk); add(canJump ? 0 : 20, dash);
    } else {
      add(60, walk); add(40, () => startRest(ts, 300 + Math.random() * 600));
    }
    let r = Math.random() * opts.reduce((a, o) => a + o[0], 0);
    for (const [wt, fn] of opts) { r -= wt; if (r <= 0) { fn(); return; } }
    opts[opts.length - 1][1]();
  }

  function pickAirTarget(w) {
    targetX = 20 + Math.random() * span(w);
    targetY = Math.random() * Math.min(maxApex(), C.scale > 1 ? 220 : 170);
  }

  function setLimbs(ts) {
    const grounded = y <= 0.5 || activity === 'climb';
    let al = -walkA * 0.7, ar = walkA * 0.7;
    let ll = walkA, lr = -walkA, gesture = false;
    if (!grounded && !AIR) {
      ll = 24; lr = -24;                              // tuck legs in the air
      al = flip.active ? 140 : 35; ar = flip.active ? -140 : -35;
    }
    if (activity === 'leap' && !grounded) {
      al = 170; ar = -170; ll = 8; lr = -8; gesture = true;   // reaching for the ceiling
    } else if (activity === 'hang') {
      const k = Math.sin(bobT * 2.5) * 12;
      al = 178; ar = -178; ll = k; lr = -k; gesture = true;   // holding on, legs dangling
    }
    if (ts < pointUntil) {
      ar = -92 + Math.sin(bobT * 3) * 4;              // arm out, pointing at you
      if (activity !== 'hang') al = 0;
      gesture = true;
    } else if (data.state === 'waiting' && activity !== 'hang') {
      const f = Math.sin(bobT * 12) * 14;
      al = 150 + f; ar = -150 - f; gesture = true;    // both arms up, flailing
    } else if (ts < celebrateUntil) {
      al = 160; ar = -160; gesture = true;            // victory arms
    } else if (ts < wavingUntil) {
      ar = -145 + Math.sin(bobT * 16) * 18; gesture = true; // hello wave
    }
    const rot = (id, a, px, py) => $(id).setAttribute('transform', 'rotate(' + a.toFixed(1) + ' ' + px + ' ' + py + ')');
    if (C.kind === 'biped') {
      rot('legl', ll, -13, 20); rot('legr', lr, 13, 20);
      rot('arml', al, -29, 2); rot('armr', ar, 29, 2);
    } else if (C.kind === 'quad') {
      // Front legs double as arms for gestures; otherwise a diagonal gait.
      // Legs are drawn behind the body, so cap raised poses at ~125° — the
      // paw tips then clear the body outline and stay visible.
      const cap = (a) => Math.max(-125, Math.min(125, a));
      const fl = gesture ? cap(al) : (grounded ? walkA : 20);
      const fr = gesture ? cap(ar) : (grounded ? -walkA : -20);
      const bl = grounded ? -walkA : 15, br = grounded ? walkA : -15;
      rot('qfl', fl, -26, 18); rot('qfr', fr, 26, 18);
      rot('qbl', bl, -10, 20); rot('qbr', br, 10, 20);
    } else if (C.kind === 'flyer') {
      if (C.flap) {
        const a = Math.sin(bobT * C.flap * 6.283) * C.flapAmp + (moving ? 8 : 0);
        if (C.wings === 'small') { rot('wingl', -a, -6, -10); rot('wingr', a, 6, -10); }
        else { rot('dwingl', -a, -8, -6); rot('dwingr', a, 8, -6); }
      }
      if (C.arms) {
        // Ghost arms: gentle float pose unless a gesture is active.
        rot('arml', gesture ? al : 18 + Math.sin(bobT * 1.8) * 6, -29, 2);
        rot('armr', gesture ? ar : -18 - Math.sin(bobT * 1.8) * 6, 29, 2);
      }
    }
  }

  function loop(ts) {
    bobT = ts / 1000;
    // Scale by real elapsed time so speed is identical on 60Hz and 120Hz.
    const dt = lastTs ? Math.min(100, ts - lastTs) : 16.7;
    lastTs = ts;
    const steps = dt / 16.7;
    const w = Math.max(120, stage.clientWidth);
    const speed = (data.state === 'working' ? 1.6 : data.state === 'done' ? 1.0 : data.state === 'idle' ? 0.35 : 0.5)
      * walkMul * (C.speed || 1) * (activity === 'dash' ? 3.2 : 1);
    const resting = ts < pauseUntil || ts < pointUntil;
    // Re-clamp targets to the current panel size — a resize mid-walk would
    // otherwise leave an unreachable target pinning the buddy to the wall.
    targetX = Math.max(4, Math.min(targetX, wallR(w)));
    targetY = Math.max(0, Math.min(targetY, maxApex()));

    if (AIR) {
      // Flyers own the whole area: free 2D flight. Bees zip and re-decide
      // constantly; the dragon glides; the ghost drifts.
      moving = !reduced && !resting;
      if (moving) {
        const dx = targetX - x, dy2 = targetY - y;
        if (Math.hypot(dx, dy2) < 6 || Math.random() < (C.retarget || 0) * steps) {
          if (Math.hypot(dx, dy2) < 6 && Math.random() < (C.restP || 0.3)) startRest(ts, 800 + Math.random() * 2500);
          pickAirTarget(w);
        } else {
          if (Math.abs(dx) > 3) dir = dx > 0 ? 1 : -1;
          const ease = Math.min(1, (C.ease || 0.02) * steps);
          x += dx * ease; y += dy2 * ease;
        }
      }
    } else if (activity === 'climb' && climb) {
      // Wall climbing and upside-down ceiling crawling.
      moving = !reduced && !resting;
      const ceilY = ceilH();
      if (moving) {
        const cs = 0.9 * walkMul * (C.climbSpeed || C.speed || 1) * steps;
        if (climb.phase === 'approach') {
          const step = speed * steps;
          if (Math.abs(targetX - x) <= step) { x = targetX; climb.phase = 'up'; }
          else { dir = targetX > x ? 1 : -1; x += dir * step; }
        } else if (climb.phase === 'up') {
          // Re-pin to the wall each frame — the panel may resize mid-climb.
          x = targetX = climb.side < 0 ? 4 : wallR(w);
          y += cs;
          if (y >= ceilY) {
            y = ceilY; climb.phase = 'ceil';
            climb.exitMode = (Math.random() < 0.5 && canJump) ? 'drop' : 'across';
            targetX = climb.exitMode === 'across'
              ? (climb.side < 0 ? wallR(w) : 4)
              : 30 + Math.random() * Math.max(1, w - CH - 62);
          }
        } else if (climb.phase === 'ceil') {
          y = ceilY; // stay glued to the ceiling through resizes, both directions
          const step = 0.8 * walkMul * (C.climbSpeed || C.speed || 1) * steps;
          if (Math.abs(targetX - x) <= step) {
            x = targetX;
            if (climb.exitMode === 'across') climb.phase = 'down';
            else { climb = null; activity = 'drop'; dropRoll = true; vy = 0; surfTarget = 360; } // let go!
          } else { dir = targetX > x ? 1 : -1; x += dir * step; }
        } else if (climb.phase === 'down') {
          x = targetX = climb.side < 0 ? wallR(w) : 4; // descending the opposite wall
          y -= cs;
          if (y <= 0) { y = 0; climb = null; surfTarget = 0; scheduleNext(ts); }
        }
      }
      if (climb) {
        surfTarget = climb.phase === 'ceil' ? 180
          : climb.phase === 'up' ? (climb.side < 0 ? 90 : -90)
          : climb.phase === 'down' ? (climb.side < 0 ? -90 : 90)
          : 0;
      }
    } else if (activity === 'hang') {
      // Hanging from the ceiling by the hands, swinging. Then: pull up and
      // crawl away, or let go.
      moving = false;
      y = ceilH();
      if (!resting && ts >= hangUntil) {
        if (Math.random() < 0.55 && canClimb) {
          const side = Math.random() < 0.5 ? -1 : 1;
          activity = 'climb';
          climb = { phase: 'ceil', side, exitMode: Math.random() < 0.5 ? 'drop' : 'across' };
          targetX = climb.exitMode === 'across' ? (side < 0 ? wallR(w) : 4) : 30 + Math.random() * Math.max(1, w - CH - 62);
        } else {
          activity = 'drop'; dropRoll = false; vy = 0;
        }
      }
    } else {
      moving = !reduced && !resting && Math.abs(targetX - x) > 0.5 && activity !== 'flip' && activity !== 'drop' && activity !== 'leap';
      // Leap: crouch briefly, then launch at the ceiling.
      if (activity === 'leap' && leap && leap.phase === 'crouch' && !resting && ts >= leap.until) {
        leap.phase = 'air';
        const ceil = ceilH();
        const apex = leap.success ? ceil + 8 : ceil * (0.55 + Math.random() * 0.35);
        jump(Math.sqrt(2 * GRAV * apex), false, ts);
      }
      if (moving) {
        const step = speed * steps;
        if (Math.abs(targetX - x) <= step) {
          x = targetX;
          if (y <= 0.5) scheduleNext(ts);
        } else {
          dir = targetX > x ? 1 : -1;
          x += dir * step;
          // Occasionally change its mind mid-walk.
          if (activity === 'walk' && Math.random() < 0.003 * steps) pickTarget(w);
        }
      } else if (resting) {
        if (data.state === 'idle' && Math.random() < 0.006 * steps) dir = -dir; // glance around
      } else if (!reduced && y <= 0.5 && vy <= 0 && activity !== 'flip' && activity !== 'drop' && activity !== 'leap') {
        // Rest expired (or a degenerate target) with nothing queued — the
        // scheduler must run again or the buddy freezes here forever.
        scheduleNext(ts);
      }
      // Jump / fall physics.
      if (y > 0 || vy > 0) {
        y += vy * steps;
        vy -= GRAV * steps;
        const ceil = ceilH();
        if (activity === 'leap' && leap && leap.success && vy > 0 && y >= ceil - 3) {
          // Grabbed the ceiling!
          y = ceil; vy = 0; leap = null; activity = 'hang';
          hangUntil = ts + 2000 + Math.random() * 3000;
          lastFx = 0; fx('✨', 30);
          if (Math.random() < 0.35) say(pick(['Nailed it! 💪', 'Look at me go!', 'Ceiling: conquered.']), 2500);
        } else {
          if (y > ceil) { y = ceil; vy = Math.min(vy, 0); }
          if (y <= 0) {
            y = 0; vy = 0; squish = 0.78; flip.active = false;
            if (activity === 'hops') {
              if (hopsLeft > 0) { hopsLeft--; jump(3 + Math.random() * 1.5, false, ts); }
              else scheduleNext(ts);
            } else if (activity === 'leap' && leap && leap.phase === 'air') {
              // Missed — tumble, see stars, dust off.
              leap = null; squish = 0.62; lastFx = 0; fx('💫', 30);
              if (Math.random() < 0.4) say(pick(['So close!', 'Gravity: 1, me: 0.', 'I meant to do that.', 'Next time, ceiling.']), 2500);
              startRest(ts, 1200 + Math.random() * 800);
            } else if (activity === 'flip' || activity === 'drop') {
              // Normalize the leftover roll so it eases the last few degrees to 0
              // in the same spin direction — short falls would otherwise pop.
              if (activity === 'drop' && dropRoll) surfCur -= 360;
              surfTarget = 0; dropRoll = false;
              scheduleNext(ts);
            }
          }
        }
      } else if (canJump && !reduced && !resting && data.state === 'waiting' && activity !== 'leap' && Math.random() < 0.05 * steps) {
        jump(4.5, false, ts);                         // urgent bouncing
      }
    }
    surfCur += (surfTarget - surfCur) * Math.min(1, 0.15 * steps);
    // Flyers: keep inside the panel vertically through resizes.
    if (AIR) y = Math.max(0, Math.min(y, maxApex()));

    // Walk cycle: legs step while walking on the floor OR crawling a surface.
    const legsActive = !AIR && moving && (y <= 0.5 || activity === 'climb');
    const gait = C.kind === 'quad' ? 22 : 26;
    walkA += ((legsActive ? Math.sin(bobT * (C.speed < 0.5 ? 5 : 10)) * (activity === 'climb' ? 18 : gait) : 0) - walkA) * Math.min(1, 0.25 * steps);
    setNap(data.state === 'idle' && ts < pauseUntil && ts >= pointUntil);
    x = Math.max(4, Math.min(x, wallR(w)));
    char.style.left = x + 'px';
    applyTransform(ts);
    setLimbs(ts);
    if (data.state === 'working' && Math.random() < 0.006 * steps) fx('⚙', CH * 0.4);
    if (activity === 'dash' && moving && Math.random() < 0.05 * steps) fx('💨', dir < 0 ? CH * 0.8 : -CH * 0.3);
    if (data.state === 'idle' && (ts < pauseUntil || reduced) && Math.random() < 0.01 * steps) fx('z', CH * 0.45);
    if (data.state === 'waiting' && Math.random() < 0.02 * steps) fx('!', CH * 0.4);
    requestAnimationFrame(loop);
  }

  let gotFirst = false;
  window.addEventListener('message', (e) => {
    const prev = data.state;
    data = (e.data && e.data.state) ? e.data : data;
    if (data.state !== prev) {
      setFace(data.state);
      // The first message after (re)load is a baseline, not a transition —
      // don't replay bubbles/confetti every time the view reopens.
      if (gotFirst) {
        if (data.state === 'waiting') say(pick(lines()), 7000);
        if (data.state === 'done') { celebrateUntil = performance.now() + 1800; say(pick(lines()), 3500); for (let i = 0; i < 5; i++) setTimeout(() => { lastFx = 0; fx(pick(['🎉','✨','⭐']), i * 14 - 28); }, i * 120); }
        if (data.state === 'error') say(pick(lines()), 6000);
      }
    }
    if (!gotFirst) wavingUntil = performance.now() + 1500; // hello wave on open
    gotFirst = true;
  });

  setFace('idle');
  vscode.postMessage({ type: 'hello' });
  requestAnimationFrame(loop);
</script>
</body>
</html>
